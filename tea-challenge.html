<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tea Arcade · 万里茶道</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1c16;color:#f5e9cd;font:15px system-ui,sans-serif}header,main{max-width:1000px;margin:auto;padding:12px 16px}header{display:flex;justify-content:space-between;gap:10px;align-items:center}a{color:#e6c98d}button{font:inherit;cursor:pointer;border:1px solid #b79a63;border-radius:12px;background:#294938;color:#fff1d4;padding:10px 14px;touch-action:manipulation}button.active,.gold{background:#e2bf79;color:#263c2b;font-weight:800}button:disabled{opacity:.4}h1{font:clamp(30px,5vw,46px) Georgia,serif;margin:8px 0}.muted{color:#bbcab9}.panel{background:#1d392b;border:1px solid #9d8051;border-radius:19px;padding:16px;margin:12px 0}.heroes{display:flex;gap:12px;flex-wrap:wrap}.heroes button{flex:1;min-width:140px}.heroes img{width:105px;height:118px;object-fit:contain;display:block;margin:auto}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.stats span{background:#2c4937;border-radius:12px;padding:8px 11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px}.board{position:relative;background:#13251e;border:6px solid #bb995c;border-radius:17px;overflow:hidden;touch-action:none}.board canvas{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;background:#0c201bdf;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;gap:12px}.overlay h2{font-size:28px;margin:0}.hidden{display:none!important}.dpad{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin:12px auto}.dpad button{font-size:22px;min-height:54px}.side button{width:100%;margin-bottom:10px}.progress{height:10px;background:#0a1d15;border-radius:12px;overflow:hidden}.progress div{height:100%;background:#e3c275}.scores td{padding:8px;border-bottom:1px solid #ffffff26}.note{font-size:13px;line-height:1.6;color:#bdcbb9}@media(max-width:720px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side .note,.side .progress{grid-column:1/-1}} </style></head><body><header><a href="index.html">← GREAT TEA ROAD</a><div><button onclick="setLanguage('ru')">RU</button> <button onclick="setLanguage('zh')">中</button> <button onclick="setLanguage('en')">EN</button></div></header><main><h1 id="title"></h1><p class="muted" id="intro"></p><section id="setup" class="panel"><h2 id="pick"></h2><div class="heroes"><button id="hero0" onclick="selectHero(0)"><img src="game-assets/chaer.svg" alt="Cha'er">茶儿</button><button id="hero1" onclick="selectHero(1)"><img src="game-assets/nik.svg" alt="Nik">尼克</button></div><p id="diffTitle"></p><div class="heroes" id="diffs"></div><p><input id="nickname" maxlength="18" placeholder="Player" style="padding:12px;border-radius:10px;border:1px solid #9a845c;background:#12291e;color:#fff"></p><button class="gold" id="start" onclick="start()"></button></section><section id="play" class="hidden"><div class="stats"><span id="stage"></span><span id="count"></span><span id="score"></span><span id="life"></span><span id="timer"></span></div><div class="layout"><div><div class="board"><canvas id="canvas" width="672" height="672"></canvas><div id="overlay" class="overlay hidden"><h2 id="result"></h2><p id="details"></p><button id="next" class="gold" onclick="next()"></button></div></div><div class="dpad"><i></i><button data-dir="up">▲</button><i></i><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><aside class="side panel"><button id="power" onclick="power()"></button><button id="pause" onclick="pause()"></button><button id="restart" onclick="restart()"></button><div class="progress"><div id="meter"></div></div><p class="note" id="help"></p></aside></div></section><section class="panel"><h2 id="leaderTitle"></h2><p class="note" id="local"></p><table class="scores" id="scores"></table></section></main><script>
const L={ru:{title:'Чайная аркада',intro:'Этап 1: собери ровно 100 листьев, убегая от врагов. Этап 2: упакуй чай на конвейере, избегая камней, мусора и ям.',pick:'Выбери героя',diff:'Сложность',ds:['Новичок','Мастер','Легенда'],start:'Начать игру',stages:['Чайный лабиринт','Караванный конвейер'],count:['Листья','Упаковано'],score:'Очки',life:'Жизни',time:'Время',power:['🍵 Щит','🧭 Ускорение'],pause:'Пауза',resume:'Продолжить',restart:'Заново',help:'WASD / стрелки / кнопки / свайпы. Пробел — способность. P — пауза. На первом этапе нужно собрать 100 листьев. На втором — поймать 30 порций чая, избегая мусора, камней и ям.',win:'Уровень пройден!',finish:'Оба этапа пройдены!',lose:'Игра окончена',next:'Следующий этап',again:'Играть снова',board:'Рекорды',local:'Рекорды сохраняются на этом устройстве. Онлайн-таблицы пока нет.',blocked:'Собери все 100 листьев!',ready:'Ворота открыты!',trap:'Осторожно! Ловушка!',bonus:'Чай собран!'},zh:{title:'茶道街机',intro:'第一关：躲避敌人，收集100片茶叶。第二关：在骆驼商队传送带上包装茶叶，躲开石头、垃圾和陷阱。',pick:'选择角色',diff:'难度',ds:['新手','高手','传奇'],start:'开始',stages:['茶叶迷宫','商队传送带'],count:['茶叶','已包装'],score:'积分',life:'生命',time:'时间',power:['🍵 护盾','🧭 加速'],pause:'暂停',resume:'继续',restart:'重来',help:'WASD、方向键、屏幕按钮或滑动。空格释放技能，P暂停。第一关收集100片茶叶，第二关包装30份茶叶并避开障碍。',win:'通关！',finish:'两关全部完成！',lose:'挑战失败',next:'下一关',again:'再玩一次',board:'本机排行榜',local:'成绩只保存在当前设备，尚无在线排行。',blocked:'先收集100片茶叶！',ready:'出口已开启！',trap:'小心陷阱！',bonus:'收集成功！'},en:{title:'Tea Arcade',intro:'Stage 1: collect 100 tea leaves while dodging enemies. Stage 2: pack tea on a camel caravan conveyor while avoiding rocks, trash and pits.',pick:'Choose hero',diff:'Difficulty',ds:['Rookie','Expert','Legend'],start:'Play',stages:['Tea maze','Caravan conveyor'],count:['Leaves','Packed'],score:'Score',life:'Lives',time:'Time',power:['🍵 Shield','🧭 Speed boost'],pause:'Pause',resume:'Resume',restart:'Restart',help:'WASD, arrows, touch buttons or swipe. Space = ability; P = pause. Collect 100 leaves in stage one, then pack 30 tea batches while avoiding obstacles.',win:'Stage cleared!',finish:'Both stages completed!',lose:'Game over',next:'Next stage',again:'Play again',board:'High scores',local:'Scores are stored on this device. No online ranking yet.',blocked:'Collect all 100 leaves!',ready:'Gate unlocked!',trap:'Watch out!',bonus:'Tea collected!'}};
const layouts=[
['#####################','#P...#.......#.....E#','#.##.#.#####.#.###..#','#....#...#...#...#..#','####.###.#.#####.#.##','#......#.#.....#.#..#','#.####.#.#####.#.##.#','#.#....#...#...#....#','#.#.######.#.#####..#','#...#......#.....#..#','###.#.##########.#..#','#...#....#.......#..#','#.#####..#.######...#','#.....#..#......#...#','#.###.#.######.#.##.#','#...#.#........#....#','###.#.##########.##.#','#...#.....#.........#','#.#######.#.#######.#','#.........#.........#','#####################'],
['#####################','#P.....#.....#.....E#','#.#####.#.###.#.###..#','#...#...#...#.#...#.#','###.#.#####.#.###.#.#','#...#.....#.#...#...#','#.#######.#.###.###.#','#.....#...#.....#...#','#.###.#.#######.#.###','#.#...#...#.....#...#','#.#.#####.#.#######.#','#.#.....#.#...#.....#','#.#####.#.###.#.###.#','#.....#.#.....#.#...#','#####.#.#######.#.###','#.....#...#.....#...#','#.#######.#.#####.#.#','#.#.......#.....#.#.#','#.#.###########.#.#.#','#.................#.#','#####################'],
['#####################','#P....#.........#..E#','#.###.#.#######.#.##','#...#.#...#.....#...#','###.#.###.#.#######.#','#...#...#.#.....#...#','#.#####.#.#####.#.###','#.#.....#.....#.#...#','#.#.#########.#.###.#','#...#.....#...#.....#','###.#.###.#.#########','#...#.#...#.........#','#.###.#.###########.#','#.....#...#.......#.#','#.#######.#.#####.#.#','#...#.....#.#...#...#','###.#.#####.#.#.###.#','#...#.....#.#.#.....#','#.#######.#.#.#######','#.........#.........#','#####################']
];
const $=x=>document.getElementById(x),C=$('canvas'),ctx=C.getContext('2d'),imgs=['game-assets/chaer.svg','game-assets/nik.svg','game-assets/tea-spirit.svg','game-assets/tea-bandit.svg'].map(src=>{const i=new Image();i.src=src;return i});const S=32,N=21;
let lang='ru',hero=0,diff=0,stage=0,state='menu',score=0,lives=3,time=0,remaining=0,grid=[],leafCells=new Set(),exit={x:19,y:1},player={x:1,y:1,dx:0,dy:0,wx:0,wy:0},enemies=[],drops=[],spawn=0,acc=0,enemyAcc=0,last=0,elapsed=0,cooldown=0,shield=0,boost=0,invuln=0,notice='',noticeTime=0,username='Player',loopRunning=false;
function setLanguage(l){lang=l;ui();hud()}function selectHero(h){hero=h;ui()}function setDiff(d){diff=d;ui()}function ui(){const t=L[lang];document.documentElement.lang=lang;$('title').textContent=t.title;$('intro').textContent=t.intro;$('pick').textContent=t.pick;$('diffTitle').textContent=t.diff;$('start').textContent=t.start;$('hero0').classList.toggle('active',hero===0);$('hero1').classList.toggle('active',hero===1);$('diffs').innerHTML=t.ds.map((v,i)=>'<button class="'+(diff===i?'active':'')+'" onclick="setDiff('+i+')">'+v+'</button>').join('');$('power').textContent=t.power[hero];$('pause').textContent=t.pause;$('restart').textContent=t.restart;$('help').textContent=t.help;$('leaderTitle').textContent=t.board;$('local').textContent=t.local;board()}
function board(){let a=[];try{a=JSON.parse(localStorage.getItem('teaArcadeScores')||'[]')}catch{}$('scores').replaceChildren();a.slice(0,10).forEach((r,i)=>{const tr=document.createElement('tr');[i+1,r.name,r.score].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});$('scores').append(tr)})}
function pass(x,y){return x>=0&&y>=0&&x<N&&y<N&&grid[y][x]!=='#'}
function setupStage(){acc=0;enemyAcc=0;spawn=0;elapsed=0;cooldown=0;shield=0;boost=0;invuln=2;notice='';drops=[];if(stage===0){grid=layouts[0].map(row=>row.split(''));let walk=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=grid[y][x];if(c==='P'){player={x,y,dx:0,dy:0,wx:0,wy:0};grid[y][x]=' '}else if(c==='E'){exit={x,y};grid[y][x]=' '}else if(c==='.'){grid[y][x]=' ';walk.push(y*N+x)}}for(let i=walk.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[walk[i],walk[j]]=[walk[j],walk[i]]}leafCells=new Set(walk.slice(0,100));remaining=100;time=160-diff*25;const spawnPoints=[[19,19],[1,19],[19,9],[11,15],[9,1]];enemies=spawnPoints.slice(0,2+diff).map(([x,y])=>({x,y,px:x,py:y}));}else{remaining=30;time=120-diff*15;player={x:10,y:17,dx:0,dy:0,wx:0,wy:0};enemies=[]}hud()}
function start(){username=$('nickname').value.trim().slice(0,18)||'Player';stage=0;score=0;lives=3;$('setup').classList.add('hidden');$('play').classList.remove('hidden');state='playing';$('overlay').classList.add('hidden');setupStage();startLoop()}
function startLoop(){last=performance.now();if(!loopRunning){loopRunning=true;requestAnimationFrame(loop)}}
function hud(){if(state==='menu')return;const t=L[lang];$('stage').textContent=t.stages[stage]+' '+(stage+1)+'/2';$('count').textContent=t.count[stage]+': '+(stage===0?100-remaining:remaining)+' / '+(stage===0?100:30);$('score').textContent=t.score+': '+score;$('life').textContent=t.life+': '+'❤️'.repeat(Math.max(0,lives));$('timer').textContent=t.time+': '+Math.ceil(time);$('power').disabled=cooldown>0||state!=='playing';$('power').textContent=t.power[hero]+(cooldown>0?' '+Math.ceil(cooldown)+'s':'');$('meter').style.width=(100*(1-cooldown/18))+'%'}
function direction(x,y){player.wx=x;player.wy=y}function power(){if(state!=='playing'||cooldown>0)return;cooldown=18;if(hero===0)shield=7;else{boost=6;invuln=Math.max(invuln,1)}hud()}
function hit(){if(invuln>0||shield>0||state!=='playing')return;lives--;invuln=2.4;score=Math.max(0,score-50);notice=L[lang].trap;noticeTime=1.1;if(lives<=0)finish(false)}
function moveMaze(){if(pass(player.x+player.wx,player.y+player.wy)){player.dx=player.wx;player.dy=player.wy}if(pass(player.x+player.dx,player.y+player.dy)){player.x+=player.dx;player.y+=player.dy}const key=player.y*N+player.x;if(leafCells.delete(key)){remaining--;score+=10*(diff+1)}if(player.x===exit.x&&player.y===exit.y){if(remaining===0){score+=Math.ceil(time)*4;state='between';popup(L[lang].win,L[lang].next)}else{notice=L[lang].blocked;noticeTime=1.1}}for(const e of enemies)if(e.x===player.x&&e.y===player.y)hit()}
function moveEnemies(){for(const e of enemies){let choices=[[1,0],[-1,0],[0,1],[0,-1]].filter(([x,y])=>pass(e.x+x,e.y+y));if(!choices.length)continue;let avoid=choices.filter(([x,y])=>e.x+x!==e.px||e.y+y!==e.py);if(avoid.length)choices=avoid;if(Math.random()<.42+diff*.17)choices.sort((a,b)=>(Math.abs(e.x+a[0]-player.x)+Math.abs(e.y+a[1]-player.y))-(Math.abs(e.x+b[0]-player.x)+Math.abs(e.y+b[1]-player.y)));const d=Math.random()<.55?choices[0]:choices[Math.floor(Math.random()*choices.length)];e.px=e.x;e.py=e.y;e.x+=d[0];e.y+=d[1];if(e.x===player.x&&e.y===player.y)hit()}}
function updateConveyor(dt){const speed=(150+diff*35);let dx=player.wx,dy=player.wy;player.x=Math.max(1,Math.min(19,player.x+dx*dt*(boost>0?11:7)));player.y=Math.max(3,Math.min(19,player.y+dy*dt*(boost>0?11:7)));spawn-=dt;if(spawn<=0){spawn=.52-diff*.08;const r=Math.random();drops.push({x:1+Math.random()*19,y:2,type:r<.57?'tea':r<.74?'rock':r<.89?'trash':'pit'})}for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=speed*dt/S;if(Math.hypot(d.x-player.x,d.y-player.y)<.85){drops.splice(i,1);if(d.type==='tea'){remaining--;score+=30;if(remaining<=0){score+=Math.ceil(time)*5;finish(true);return}}else hit()}else if(d.y>21)drops.splice(i,1)}}
function popup(title,button){$('result').textContent=title;$('details').textContent=L[lang].score+': '+score;$('next').textContent=button;$('overlay').classList.remove('hidden')}
function finish(won){if(state==='finished')return;state='finished';popup(won?L[lang].finish:L[lang].lose,L[lang].again);try{let a=JSON.parse(localStorage.getItem('teaArcadeScores')||'[]');a.push({name:username,score});a.sort((a,b)=>b.score-a.score);localStorage.setItem('teaArcadeScores',JSON.stringify(a.slice(0,10)))}catch{}board()}
function next(){if(state==='finished'){restart();return}if(state==='between'){stage=1;setupStage()}state='playing';$('overlay').classList.add('hidden');startLoop()}
function pause(){if(state==='playing'){state='paused';popup(L[lang].pause,L[lang].resume)}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');startLoop()}}
function restart(){stage=0;score=0;lives=3;state='playing';setupStage();$('overlay').classList.add('hidden');startLoop()}
function imageAt(img,x,y,w,h,flip=false){if(!img.complete||!img.naturalWidth)return;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()}
function draw(){ctx.clearRect(0,0,672,672);if(stage===0){ctx.fillStyle='#1b3929';ctx.fillRect(0,0,672,672);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const X=x*S,Y=y*S;if(grid[y][x]==='#'){ctx.fillStyle='#4b7050';ctx.fillRect(X+1,Y+1,30,30);ctx.fillStyle='#729263';ctx.fillRect(X+3,Y+3,26,5)}else if(leafCells.has(y*N+x)){ctx.fillStyle='#a4d975';ctx.save();ctx.translate(X+16,Y+16);ctx.rotate(-.6);ctx.beginPath();ctx.ellipse(0,0,7,4,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3d7541';ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);ctx.stroke();ctx.restore()}}const ex=exit.x*S,ey=exit.y*S;ctx.fillStyle=remaining===0?'#ffdf78':'#8e7d57';ctx.fillRect(ex+4,ey+2,24,28);ctx.fillStyle='#483d2a';ctx.fillRect(ex+10,ey+8,12,22);for(const e of enemies){const bob=Math.sin(elapsed*12+e.x)*2;imageAt(imgs[3],e.x*S+16,e.y*S+14+bob,31,38);if(!imgs[3].complete){ctx.fillText('👹',e.x*S,e.y*S)}}}else{ctx.fillStyle='#a8b7a0';ctx.fillRect(0,0,672,672);ctx.fillStyle='#537a54';ctx.fillRect(0,0,672,90);ctx.font='44px serif';for(let i=0;i<8;i++)ctx.fillText('🐫',i*95+Math.sin(elapsed*.8)*10,55);ctx.fillStyle='#6c5540';ctx.fillRect(0,90,672,582);ctx.fillStyle='#a78c62';for(let x=0;x<672;x+=55){let y=(elapsed*160)%55;for(let j=0;j<12;j++)ctx.fillRect(x,90+(j*55+y)%582,42,8)}ctx.strokeStyle='#e8c891';ctx.lineWidth=9;ctx.strokeRect(12,100,648,560);ctx.font='31px serif';for(const d of drops)ctx.fillText({tea:'🍃',rock:'🪨',trash:'🗑️',pit:'🕳️'}[d.type],d.x*S-14,d.y*S+12)}const px=player.x*S+16,py=player.y*S+16;if(shield>0||invuln>0){ctx.strokeStyle=shield>0?'#ffe59a':'#c8f2ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,23,0,Math.PI*2);ctx.stroke()}const run=Math.sin(elapsed*17)*4;ctx.save();ctx.translate(px,py+run);if(player.dx<0||player.wx<0)ctx.scale(-1,1);imageAt(imgs[hero],0,0,43,55);ctx.restore();imageAt(imgs[2],px+22,py-22+Math.sin(elapsed*5)*5,23,23);if(noticeTime>0){ctx.fillStyle='#102a20e9';ctx.fillRect(70,300,532,60);ctx.fillStyle='#ffdf98';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(notice,336,337);ctx.textAlign='left'}}
function loop(now){if(state!=='playing'){loopRunning=false;return}const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;time-=dt;cooldown=Math.max(0,cooldown-dt);shield=Math.max(0,shield-dt);boost=Math.max(0,boost-dt);invuln=Math.max(0,invuln-dt);noticeTime=Math.max(0,noticeTime-dt);if(time<=0)finish(false);if(state==='playing'){if(stage===0){acc+=dt;enemyAcc+=dt;if(acc>(boost>0?.072:.118)){acc=0;moveMaze()}if(enemyAcc>(.24-diff*.035)){enemyAcc=0;moveEnemies()}}else updateConveyor(dt)}draw();hud();if(state==='playing')requestAnimationFrame(loop);else loopRunning=false}
const directions={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};document.addEventListener('keydown',e=>{if(directions[e.key]){direction(...directions[e.key]);e.preventDefault()}if(e.code==='Space'){power();e.preventDefault()}if(e.key.toLowerCase()==='p')pause()});document.querySelectorAll('[data-dir]').forEach(b=>{const d={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[b.dataset.dir];b.addEventListener('pointerdown',e=>{direction(...d);e.preventDefault()});});let touch=null;C.addEventListener('pointerdown',e=>touch={x:e.clientX,y:e.clientY});C.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.hypot(dx,dy)>15)direction(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));touch=null});ui();draw();
