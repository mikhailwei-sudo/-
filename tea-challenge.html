<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>茶道挑战 · Tea Road Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:#10241c;color:#f8edcf;font:16px system-ui,sans-serif}header,.wrap{max-width:1000px;margin:auto;padding:15px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#f0c880}h1{font:clamp(28px,5vw,46px) Georgia,serif;margin:12px 0}button,input{font:inherit}button{cursor:pointer;border:2px solid #a8874d;border-radius:14px;background:#365a40;color:#fff4d9;padding:10px 15px;touch-action:manipulation}button:disabled{opacity:.4}button.selected,.gold{background:#dcb66f;color:#263526}main{max-width:1000px;margin:auto;padding:0 15px 40px}.top{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.tag{background:#244335;border:1px solid #617e5c;border-radius:20px;padding:9px 14px}.card{border:2px solid #b79660;background:#213c2d;border-radius:20px;padding:18px;margin:12px 0}.pick{display:flex;gap:10px;flex-wrap:wrap}.pick button{flex:1;min-width:145px}.avatar{font-size:56px;display:block}.arena{position:relative;width:100%;aspect-ratio:16/10;min-height:300px;max-height:590px;border:7px solid #b18b55;border-radius:24px;overflow:hidden;background:linear-gradient(#8ac8c4 0 55%,#81aa64 55%);touch-action:none}.arena:before{content:'';position:absolute;bottom:0;width:100%;height:48%;background:repeating-linear-gradient(140deg,#71974f 0 35px,#7eaa56 35px 70px)}.arena canvas{position:relative;width:100%;height:100%;display:block}.controls{display:flex;justify-content:center;gap:14px;margin:12px 0}.controls button{font-size:25px;min-width:70px;min-height:60px}.hidden{display:none!important}.feedback{font-weight:700;color:#f5d18a;min-height:24px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.leader{width:100%;border-collapse:collapse}.leader td,.leader th{padding:8px;border-bottom:1px solid #ffffff30;text-align:left}.muted{color:#b8cdbb}.progress{height:12px;border-radius:20px;background:#112b1d;overflow:hidden}.progress>div{height:100%;background:#e7c17a;transition:width .2s}@media(max-width:500px){.arena{aspect-ratio:4/5}.controls button{min-width:62px}} </style></head><body><header><a href="index.html">← GREAT TEA ROAD</a><div><button onclick="setLang('ru')">RU</button> <button onclick="setLang('zh')">中</button> <button onclick="setLang('en')">EN</button></div></header><main><h1 id="heading">茶道挑战 · Чайный чемпионат</h1><p id="intro" class="muted"></p><section id="setup" class="card"><h2 id="pickTitle"></h2><div id="avatars" class="pick"></div><p id="difficultyTitle"></p><div id="diffs" class="pick"></div><p><input id="playerName" maxlength="18" placeholder="Имя игрока" aria-label="Имя игрока"></p><button id="start" class="gold"></button></section><section id="play" class="hidden"><div class="top"><span class="tag" id="stage"></span><span class="tag" id="points"></span><span class="tag" id="clock"></span><span class="tag" id="lives"></span></div><div class="progress"><div id="bar"></div></div><h2 id="mission"></h2><p id="hint" class="muted"></p><div class="arena"><canvas id="canvas" width="900" height="570"></canvas></div><div class="controls" id="controls"><button data-dir="left" aria-label="Left">◀</button><button data-dir="up" aria-label="Up">▲</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button></div><div class="card hidden" id="question"><h3 id="questionText"></h3><div class="choices" id="answers"></div></div><p id="feedback" class="feedback" aria-live="polite"></p></section><section class="card"><h2 id="boardTitle"></h2><p id="boardHint" class="muted"></p><table class="leader"><thead><tr><th>#</th><th id="nameHead"></th><th id="scoreHead"></th></tr></thead><tbody id="leaderboard"></tbody></table></section></main><script>
const I={ru:{intro:'Три этапа, управление героем, таймер, соперники и таблица рекордов на этом устройстве.',pick:'Выбери героя',diff:'Сложность',start:'Начать соревнование',names:['Мэй · чайная мастерица','Иван · путешественник'],diffs:['Новичок','Мастер','Легенда'],stages:['Чайная ферма','Чайная мастерская','Чайный караван'],hints:['Собери зелёные листья. Избегай красных вредителей!','Собери чайные листья и ответь на вопросы о чае.','Доставь чай к золотым воротам, обходя препятствия.'],board:'Таблица чемпионов',local:'Рекорды сохраняются только в этом браузере.',name:'Игрок',score:'Очки',life:'Жизни',time:'Время',done:'Победа! Все три этапа пройдены!',lost:'Игра окончена!',again:'Играть снова',question:'Какой это чай?',right:'Верно!',wrong:'Неверно! −1 жизнь',q:['Лунцзин','Тегуаньинь','Аньхуа хэйча','Цимэнь'],opts:['Зелёный','Улун','Тёмный','Красный'],rank:'Ранг'},zh:{intro:'三大关卡，角色操控、倒计时、障碍与本机排行榜。',pick:'选择角色',diff:'难度',start:'开始挑战',names:['小梅 · 制茶师','伊万 · 旅行者'],diffs:['新手','高手','传奇'],stages:['茶园采摘','制茶工坊','万里茶道商队'],hints:['收集绿色茶叶，避开红色害虫！','收集茶叶并回答茶文化问题。','躲避障碍，将茶叶送到金色大门。'],board:'冠军榜',local:'成绩仅保存在当前浏览器。',name:'玩家',score:'积分',life:'生命',time:'时间',done:'胜利！三关全部完成！',lost:'挑战结束！',again:'再玩一次',question:'这是什么茶？',right:'正确！',wrong:'答错了！失去一条生命',q:['龙井','铁观音','安化黑茶','祁门红茶'],opts:['绿茶','乌龙茶','黑茶','红茶'],rank:'排名'},en:{intro:'Three stages, playable characters, a timer, obstacles and local high scores.',pick:'Choose a hero',diff:'Difficulty',start:'Start challenge',names:['Mei · tea artisan','Ivan · explorer'],diffs:['Rookie','Expert','Legend'],stages:['Tea farm','Tea workshop','Tea caravan'],hints:['Collect green leaves. Avoid red pests!','Collect tea and answer knowledge questions.','Deliver the tea to the golden gate while avoiding obstacles.'],board:'Champions',local:'Scores are saved only in this browser.',name:'Player',score:'Score',life:'Lives',time:'Time',done:'Victory! All three stages complete!',lost:'Game over!',again:'Play again',question:'Which type of tea?',right:'Correct!',wrong:'Wrong! Lose one life',q:['Longjing','Tieguanyin','Anhua dark tea','Keemun'],opts:['Green','Oolong','Dark','Black / red'],rank:'Rank'}};
let lang='ru',hero=0,difficulty=0,active=false,stage=0,score=0,lives=3,remaining=0,needed=0,collected=0,questionIndex=0,player={x:80,y:270},items=[],hazards=[],last=0,keys={},message='',name='Player',waiting=false;
const $=s=>document.getElementById(s),ctx=$('canvas').getContext('2d'),W=900,H=570;
function setLang(l){lang=l;renderStatic();if(active)updateHUD()}function renderStatic(){const t=I[lang];$('intro').textContent=t.intro;$('pickTitle').textContent=t.pick;$('difficultyTitle').textContent=t.diff;$('start').textContent=t.start;$('boardTitle').textContent=t.board;$('boardHint').textContent=t.local;$('nameHead').textContent=t.name;$('scoreHead').textContent=t.score;$('avatars').innerHTML=t.names.map((n,i)=>'<button class="'+(hero===i?'selected':'')+'" onclick="hero='+i+';renderStatic()"><span class="avatar">'+['👧🏻','👦🏼'][i]+'</span>'+n+'</button>').join('');$('diffs').innerHTML=t.diffs.map((n,i)=>'<button class="'+(difficulty===i?'selected':'')+'" onclick="difficulty='+i+';renderStatic()">'+n+'</button>').join('');renderBoard()}
function renderBoard(){let arr=[];try{arr=JSON.parse(localStorage.getItem('teaChampions')||'[]')}catch{}$('leaderboard').innerHTML=arr.slice(0,10).map((x,i)=>'<tr><td>'+(i+1)+'</td><td></td><td>'+Number(x.score)+'</td></tr>').join('');arr.slice(0,10).forEach((x,i)=>$('leaderboard').rows[i].cells[1].textContent=x.name)}
function randomItem(){return{x:65+Math.random()*770,y:75+Math.random()*410}}function initStage(){collected=0;needed=[8,5,6][stage]+difficulty*2;remaining=[65,75,80][stage]-difficulty*12;player={x:80,y:270};items=Array.from({length:needed},randomItem);hazards=Array.from({length:3+difficulty*2+stage},()=>({...randomItem(),vx:(Math.random()>.5?1:-1)*(50+difficulty*32),vy:(Math.random()>.5?1:-1)*(35+difficulty*20)}));waiting=false;$('question').classList.add('hidden');updateHUD()}
function updateHUD(){const t=I[lang];$('stage').textContent=t.stages[stage]+' ('+(stage+1)+'/3)';$('points').textContent=t.score+': '+score;$('clock').textContent=t.time+': '+Math.ceil(remaining);$('lives').textContent=t.life+': '+'❤️'.repeat(Math.max(0,lives));$('mission').textContent=t.stages[stage];$('hint').textContent=t.hints[stage];$('bar').style.width=(collected/needed*100)+'%';$('feedback').textContent=message}
function start(){hero=hero|0;name=$('playerName').value.trim().slice(0,18)||I[lang].name;stage=0;score=0;lives=3;message='';active=true;$('setup').classList.add('hidden');$('play').classList.remove('hidden');initStage();last=performance.now();requestAnimationFrame(frame)}
function end(won){active=false;message=(won?I[lang].done:I[lang].lost)+' '+score+' ⭐';updateHUD();$('question').classList.add('hidden');$('controls').classList.add('hidden');$('hint').textContent=message;const b=document.createElement('button');b.textContent=I[lang].again;b.className='gold';b.onclick=()=>{b.remove();$('controls').classList.remove('hidden');start()};$('hint').append(' ',b);try{let a=JSON.parse(localStorage.getItem('teaChampions')||'[]');a.push({name,score});a.sort((x,y)=>y.score-x.score);localStorage.setItem('teaChampions',JSON.stringify(a.slice(0,10)))}catch{}renderBoard()}
function nextStage(){score+=Math.ceil(remaining)*3;stage++;if(stage===3){end(true);return}initStage()}
function quiz(){waiting=true;const t=I[lang],idx=questionIndex++%4;$('question').classList.remove('hidden');$('questionText').textContent=t.question+' '+t.q[idx];$('answers').innerHTML=t.opts.map((o,i)=>'<button data-answer="'+i+'">'+o+'</button>').join('');$('answers').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.answer===idx){score+=120;message=t.right}else{lives--;message=t.wrong}waiting=false;$('question').classList.add('hidden');updateHUD();if(lives<=0)end(false);else if(collected>=needed)nextStage()})}
function draw(){ctx.clearRect(0,0,W,H);ctx.font='42px serif';ctx.textAlign='center';for(const it of items)ctx.fillText(stage===2?'📦':'🍃',it.x,it.y+13);for(const h of hazards)ctx.fillText(stage===2?'🪨':'🐞',h.x,h.y+12);if(stage===2){ctx.font='64px serif';ctx.fillText('🏯',830,270)}ctx.font='68px serif';ctx.fillText(hero===0?'👧🏻':'👦🏼',player.x,player.y+20);ctx.font='20px system-ui';ctx.fillStyle='#173629';ctx.fillText(name,player.x,player.y-44)}
function frame(now){if(!active)return;let dt=Math.min((now-last)/1000,.05);last=now;if(!waiting){remaining-=dt;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);let norm=Math.hypot(dx,dy)||1;player.x=Math.max(35,Math.min(W-35,player.x+dx/norm*(220+difficulty*12)*dt));player.y=Math.max(45,Math.min(H-30,player.y+dy/norm*(220+difficulty*12)*dt));for(let i=items.length-1;i>=0;i--){if(Math.hypot(player.x-items[i].x,player.y-items[i].y)<52){items.splice(i,1);collected++;score+=30+difficulty*10;if(collected>=needed){if(stage===1)quiz();else nextStage();break}}}for(const h of hazards){h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.x<30||h.x>W-30)h.vx*=-1;if(h.y<40||h.y>H-30)h.vy*=-1;if(Math.hypot(player.x-h.x,player.y-h.y)<47){lives--;score=Math.max(0,score-25);h.x=850;h.y=80;message='−1 ❤️';if(lives<=0){end(false);break}}}if(remaining<=0)end(false);updateHUD()}draw();if(active)requestAnimationFrame(frame)}
$('start').onclick=start;document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}});document.addEventListener('keyup',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(map[e.key])keys[map[e.key]]=false});document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[d]=false)});let touch=null;$('canvas').addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};$('canvas').setPointerCapture(e.pointerId)});$('canvas').addEventListener('pointermove',e=>{if(!touch)return;const r=$('canvas').getBoundingClientRect();player.x=Math.max(35,Math.min(W-35,(e.clientX-r.left)/r.width*W));player.y=Math.max(45,Math.min(H-30,(e.clientY-r.top)/r.height*H))});$('canvas').addEventListener('pointerup',()=>touch=null);renderStatic();
</script></body></html>
