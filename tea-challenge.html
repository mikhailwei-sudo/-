<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tea Maze · 万里茶道</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1c17;color:#f6e9c8;font:15px system-ui,sans-serif}header{max-width:1050px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}a{color:#ebc78c}button{font:inherit;cursor:pointer;border:1px solid #a88a54;border-radius:12px;padding:10px 14px;color:#fff1cf;background:#2b4b3a;touch-action:manipulation}button.active,.gold{background:#dcb978;color:#1c3025;font-weight:800}button:disabled{opacity:.45}main{max-width:1050px;margin:auto;padding:10px 16px 50px}h1{font:clamp(30px,5vw,48px) Georgia,serif;margin:8px 0}.muted{color:#b9cabb}.panel{background:#1b3429;border:1px solid #8b774c;border-radius:20px;padding:16px;margin:14px 0}.select{display:flex;gap:12px;flex-wrap:wrap}.hero{flex:1;min-width:145px}.hero img{display:block;width:100px;height:120px;object-fit:contain;margin:auto}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stats span{background:#264739;padding:9px 12px;border-radius:15px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:15px;align-items:start}.game{position:relative;border:6px solid #b18d56;border-radius:18px;overflow:hidden;background:#13281f;touch-action:none}.game canvas{display:block;width:100%;height:auto;image-rendering:auto}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d211ddc;padding:24px;text-align:center;gap:12px}.overlay h2{font-size:30px;margin:0}.hidden{display:none!important}.dpad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:12px 0}.dpad button{min-height:53px;font-size:23px}.side button{width:100%;margin:5px 0}.note{font-size:13px;color:#bbccb9;line-height:1.5}.board{width:100%;border-collapse:collapse}.board td{padding:8px;border-bottom:1px solid #ffffff24}.meter{height:8px;border-radius:8px;background:#0b2017;overflow:hidden}.meter>div{height:100%;background:#e4c276}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side .note{grid-column:1/-1}.dpad{margin:4px auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><header><a href="index.html">← GREAT TEA ROAD</a><div><button onclick="language('ru')">RU</button> <button onclick="language('zh')">中</button> <button onclick="language('en')">EN</button></div></header><main><h1 id="title"></h1><p class="muted" id="intro"></p><div class="panel" id="setup"><h2 id="choose"></h2><div class="select"><button class="hero" id="chooseMei" onclick="pick(0)"><img src="game-assets/chaer.svg" alt="Cha'er">茶儿</button><button class="hero" id="chooseNik" onclick="pick(1)"><img src="game-assets/nik.svg" alt="Nik">尼克</button></div><p id="difficulty"></p><div class="select" id="diffButtons"></div><p><input id="nickname" maxlength="18" placeholder="Player" style="padding:12px;background:#10271e;color:#fff;border:1px solid #8d7850;border-radius:10px;max-width:100%"></p><button class="gold" id="start" onclick="start()"></button></div><div id="play" class="hidden"><div class="stats"><span id="level"></span><span id="score"></span><span id="lives"></span><span id="timer"></span><span id="remaining"></span></div><div class="layout"><div><div class="game"><canvas id="canvas" width="672" height="672" aria-label="Tea maze game"></canvas><div class="overlay hidden" id="overlay"><h2 id="result"></h2><p id="resultDetail"></p><button class="gold" id="continue" onclick="resume()"></button></div></div><div class="dpad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><div class="side panel"><button id="ability" onclick="ability()"></button><button id="pause" onclick="togglePause()"></button><button id="restart" onclick="restart()"></button><div class="meter"><div id="coolbar"></div></div><p class="note" id="help"></p></div></div></div><section class="panel"><h2 id="leaders"></h2><p class="note" id="local"></p><table class="board" id="board"></table></section></main><script>
const TR={ru:{title:'Чайный лабиринт',intro:'Аркадная игра с видом сверху: собирай чай, обходи стражей и проходи три лабиринта.',choose:'Выбери героя',difficulty:'Сложность',diff:['Новичок','Мастер','Легенда'],start:'Играть',levels:['Чайная ферма','Чайная мастерская','Чайный караван'],score:'Очки',lives:'Жизни',time:'Время',left:'Чай',ability:['🍵 Чайный щит','🧭 Рывок'],pause:'Пауза',resume:'Продолжить',restart:'Сначала',help:'Стрелки / WASD / экранные кнопки / свайп. Собери весь чай, затем доберись до золотых ворот. Пробел — способность, P — пауза.',win:'Этап пройден!',lose:'Игра окончена',complete:'Чайный путь пройден!',next:'Следующий этап',again:'Играть снова',board:'Местные рекорды',local:'Результаты хранятся только на этом устройстве. Онлайн-рейтинг пока не подключён.',ready:'Найди золотые ворота!',blocked:'Сначала собери весь чай!'},zh:{title:'茶道迷宫',intro:'俯视角街机游戏：收集茶叶、躲避守卫、闯过三座迷宫。',choose:'选择角色',difficulty:'难度',diff:['新手','高手','传奇'],start:'开始游戏',levels:['茶园','制茶工坊','茶叶商队'],score:'积分',lives:'生命',time:'时间',left:'茶叶',ability:['🍵 茶之护盾','🧭 冲刺'],pause:'暂停',resume:'继续',restart:'重新开始',help:'方向键 / WASD / 屏幕按钮 / 滑动。收集所有茶叶后前往金色出口。空格使用技能，P暂停。',win:'过关！',lose:'挑战失败',complete:'万里茶道通关！',next:'下一关',again:'再玩一次',board:'本地排行榜',local:'成绩只保存在当前设备，尚未启用在线排名。',ready:'前往金色出口！',blocked:'请先收集全部茶叶！'},en:{title:'Tea Maze',intro:'Top-down arcade adventure: collect tea, dodge guards and clear three mazes.',choose:'Choose your hero',difficulty:'Difficulty',diff:['Rookie','Expert','Legend'],start:'Play',levels:['Tea farm','Tea workshop','Tea caravan'],score:'Score',lives:'Lives',time:'Time',left:'Tea',ability:['🍵 Tea shield','🧭 Dash'],pause:'Pause',resume:'Resume',restart:'Restart',help:'Arrows / WASD / on-screen buttons / swipe. Collect all tea then reach the golden exit. Space = skill, P = pause.',win:'Level cleared!',lose:'Game over',complete:'Tea Road completed!',next:'Next stage',again:'Play again',board:'Local high scores',local:'Scores stay on this device. No online leaderboard yet.',ready:'Find the golden exit!',blocked:'Collect all tea first!'}};
const layouts=[
['#####################','#P...#.......#.....E#','#.##.#.#####.#.###..#','#....#...#...#...#..#','####.###.#.#####.#.##','#......#.#.....#.#..#','#.####.#.#####.#.##.#','#.#....#...#...#....#','#.#.######.#.#####..#','#...#......#.....#..#','###.#.##########.#..#','#...#....#.......#..#','#.#####..#.######...#','#.....#..#......#...#','#.###.#.######.#.##.#','#...#.#........#....#','###.#.##########.##.#','#...#.....#.........#','#.#######.#.#######.#','#.........#.........#','#####################'],
['#####################','#P.....#.....#.....E#','#.#####.#.###.#.###..#','#...#...#...#.#...#.#','###.#.#####.#.###.#.#','#...#.....#.#...#...#','#.#######.#.###.###.#','#.....#...#.....#...#','#.###.#.#######.#.###','#.#...#...#.....#...#','#.#.#####.#.#######.#','#.#.....#.#...#.....#','#.#####.#.###.#.###.#','#.....#.#.....#.#...#','#####.#.#######.#.###','#.....#...#.....#...#','#.#######.#.#####.#.#','#.#.......#.....#.#.#','#.#.###########.#.#.#','#.................#.#','#####################'],
['#####################','#P....#.........#..E#','#.###.#.#######.#.##','#...#.#...#.....#...#','###.#.###.#.#######.#','#...#...#.#.....#...#','#.#####.#.#####.#.###','#.#.....#.....#.#...#','#.#.#########.#.###.#','#...#.....#...#.....#','###.#.###.#.#########','#...#.#...#.........#','#.###.#.###########.#','#.....#...#.......#.#','#.#######.#.#####.#.#','#...#.....#.#...#...#','###.#.#####.#.#.###.#','#...#.....#.#.#.....#','#.#######.#.#.#######','#.........#.........#','#####################']
];const N=21,S=32,canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),imgs=['game-assets/chaer.svg','game-assets/nik.svg','game-assets/tea-spirit.svg'].map(src=>{let i=new Image();i.src=src;return i});
let lang='ru',hero=0,diff=0,stage=0,score=0,lives=3,time=0,grid=[],tea=0,exit={x:19,y:1},p={x:1,y:1,dx:0,dy:0,wantX:0,wantY:0},enemies=[],cooldown=0,shield=0,dash=0,invuln=0,elapsed=0,acc=0,last=0,state='menu',name='Player',notice='',noticeTime=0;
const $=id=>document.getElementById(id);function language(l){lang=l;ui();hud()}function pick(n){hero=n;ui()}function setDiff(n){diff=n;ui()}function ui(){let t=TR[lang];document.documentElement.lang=lang;$('title').textContent=t.title;$('intro').textContent=t.intro;$('choose').textContent=t.choose;$('difficulty').textContent=t.difficulty;$('start').textContent=t.start;$('chooseMei').classList.toggle('active',hero===0);$('chooseNik').classList.toggle('active',hero===1);$('diffButtons').innerHTML=t.diff.map((s,i)=>'<button class="'+(diff===i?'active':'')+'" onclick="setDiff('+i+')">'+s+'</button>').join('');$('ability').textContent=t.ability[hero];$('pause').textContent=t.pause;$('restart').textContent=t.restart;$('help').textContent=t.help;$('leaders').textContent=t.board;$('local').textContent=t.local;board()}
function board(){let arr=[];try{arr=JSON.parse(localStorage.getItem('teaMazeScores')||'[]')}catch{}$('board').replaceChildren();arr.slice(0,10).forEach((r,i)=>{const tr=document.createElement('tr');[String(i+1),String(r.name),String(r.score)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});$('board').append(tr)})}
function init(){grid=layouts[stage].map(s=>s.split(''));tea=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(grid[y][x]==='P'){p={x,y,dx:0,dy:0,wantX:0,wantY:0};grid[y][x]=' '}else if(grid[y][x]==='E'){exit={x,y};grid[y][x]=' '}else if(grid[y][x]==='.')tea++}enemies=[];const spots=[[19,19],[1,19],[19,9],[9,1],[11,15],[3,11]];for(let i=0;i<2+stage+diff;i++){let q=spots[i%spots.length];if(grid[q[1]][q[0]]==='#')q=[19,19];enemies.push({x:q[0],y:q[1],dx:0,dy:0,prevX:q[0],prevY:q[1]})}time=105-stage*7-diff*15;cooldown=0;shield=0;dash=0;invuln=2;acc=0;notice='';hud()}
function hud(){if(state==='menu')return;const t=TR[lang];$('level').textContent=t.levels[stage]+' '+(stage+1)+'/3';$('score').textContent=t.score+': '+score;$('lives').textContent=t.lives+': '+'❤️'.repeat(Math.max(0,lives));$('timer').textContent=t.time+': '+Math.ceil(time);$('remaining').textContent=t.left+': '+tea;$('ability').disabled=cooldown>0||state!=='playing';$('ability').textContent=t.ability[hero]+(cooldown>0?' '+Math.ceil(cooldown)+'s':'');$('coolbar').style.width=(100*(1-cooldown/18))+'%'}
function start(){name=$('nickname').value.trim().slice(0,18)||'Player';stage=0;score=0;lives=3;$('setup').classList.add('hidden');$('play').classList.remove('hidden');state='playing';$('overlay').classList.add('hidden');init();last=performance.now();requestAnimationFrame(loop)}
function pass(x,y){return x>=0&&y>=0&&x<N&&y<N&&grid[y][x]!=='#'}function direction(dx,dy){p.wantX=dx;p.wantY=dy}function ability(){if(state!=='playing'||cooldown>0)return;cooldown=18;if(hero===0){shield=7;score+=25}else{dash=5;invuln=1;score+=25}hud()}
function hit(){if(invuln>0||shield>0)return;lives--;invuln=2.5;score=Math.max(0,score-40);if(lives<=0)finish(false);hud()}
function move(){if(pass(p.x+p.wantX,p.y+p.wantY)){p.dx=p.wantX;p.dy=p.wantY}if(pass(p.x+p.dx,p.y+p.dy)){p.x+=p.dx;p.y+=p.dy}if(grid[p.y][p.x]==='.'){grid[p.y][p.x]=' ';tea--;score+=10*(diff+1)}if(p.x===exit.x&&p.y===exit.y){if(tea===0){score+=Math.ceil(time)*5;stage++;if(stage===3)finish(true);else{state='between';popup(TR[lang].win,TR[lang].next)}}else{notice=TR[lang].blocked;noticeTime=1.3}}for(const e of enemies)if(e.x===p.x&&e.y===p.y)hit();hud()}
function enemyStep(){for(const e of enemies){let dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(([x,y])=>pass(e.x+x,e.y+y));if(!dirs.length)continue;let options=dirs.filter(([x,y])=>e.x+x!==e.prevX||e.y+y!==e.prevY);if(!options.length)options=dirs;let chase=Math.random()<(.20+diff*.14+stage*.08);if(chase)options.sort((a,b)=>(Math.abs(e.x+a[0]-p.x)+Math.abs(e.y+a[1]-p.y))-(Math.abs(e.x+b[0]-p.x)+Math.abs(e.y+b[1]-p.y)));let d=chase?options[0]:options[Math.floor(Math.random()*options.length)];e.prevX=e.x;e.prevY=e.y;e.x+=d[0];e.y+=d[1];if(e.x===p.x&&e.y===p.y)hit()}}
function popup(title,button){$('result').textContent=title;$('resultDetail').textContent=TR[lang].score+': '+score;$('continue').textContent=button;$('overlay').classList.remove('hidden')}
function finish(won){state='finished';popup(won?TR[lang].complete:TR[lang].lose,TR[lang].again);try{let a=JSON.parse(localStorage.getItem('teaMazeScores')||'[]');a.push({name,score});a.sort((a,b)=>b.score-a.score);localStorage.setItem('teaMazeScores',JSON.stringify(a.slice(0,10)))}catch{}board()}
function resume(){if(state==='finished'){restart();return}if(state==='between')init();state='playing';$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function togglePause(){if(state==='playing'){state='paused';popup(TR[lang].pause,TR[lang].resume)}else if(state==='paused')resume()}function restart(){stage=0;score=0;lives=3;state='playing';init();$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,672,672);ctx.fillStyle=['#244333','#443b2a','#293b43'][stage];ctx.fillRect(0,0,672,672);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let c=grid[y][x],px=x*S,py=y*S;if(c==='#'){ctx.fillStyle=['#456d54','#755c3c','#4b6570'][stage];ctx.fillRect(px+1,py+1,30,30);ctx.fillStyle='#ffffff13';ctx.fillRect(px+3,py+3,26,4)}else if(c==='.'){ctx.fillStyle='#b9dd80';ctx.beginPath();ctx.ellipse(px+16,py+16,5,3,-.6,0,Math.PI*2);ctx.fill()}}let ex=exit.x*S,ey=exit.y*S;ctx.fillStyle=tea===0?'#ffda69':'#8c774b';ctx.fillRect(ex+4,ey+3,24,26);ctx.fillStyle='#4a3820';ctx.fillRect(ex+9,ey+9,14,20);ctx.font='19px serif';ctx.fillText('★',ex+9,ey+21);for(const e of enemies){ctx.font='26px serif';ctx.fillText(stage===2?'🐺':'🐞',e.x*S+2,e.y*S+27)}let bob=Math.sin(elapsed*11)*2;if(shield>0||invuln>0){ctx.strokeStyle=shield>0?'#f7d971':'#c9f4ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x*S+16,p.y*S+16,19,0,Math.PI*2);ctx.stroke()}ctx.save();ctx.translate(p.x*S+16,p.y*S+16+bob);if(p.dx<0)ctx.scale(-1,1);const img=imgs[hero];if(img.complete&&img.naturalWidth)ctx.drawImage(img,-20,-27,40,52);else{ctx.font='30px serif';ctx.fillText(hero?'👦':'👧',-15,12)}ctx.restore();if(imgs[2].complete&&imgs[2].naturalWidth)ctx.drawImage(imgs[2],p.x*S+20,p.y*S-14+Math.sin(elapsed*5)*3,21,21);if(noticeTime>0){ctx.fillStyle='#13281fe9';ctx.fillRect(100,300,472,56);ctx.fillStyle='#f6d88d';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(notice,336,334);ctx.textAlign='left'}}
function loop(now){if(state!=='playing')return;let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;time-=dt;cooldown=Math.max(0,cooldown-dt);shield=Math.max(0,shield-dt);dash=Math.max(0,dash-dt);invuln=Math.max(0,invuln-dt);noticeTime=Math.max(0,noticeTime-dt);acc+=dt;if(time<=0){finish(false);draw();return}const stepTime=hero===1&&dash>0?.075:.135;if(acc>=stepTime){acc=0;move();if(state==='playing'&&Math.random()<.8)enemyStep()}draw();hud();if(state==='playing')requestAnimationFrame(loop)}
const keymap={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};document.addEventListener('keydown',e=>{if(keymap[e.key]){direction(...keymap[e.key]);e.preventDefault()}if(e.code==='Space'){ability();e.preventDefault()}if(e.key.toLowerCase()==='p')togglePause()});document.querySelectorAll('[data-dir]').forEach(b=>{const d={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[b.dataset.dir];b.addEventListener('pointerdown',e=>{direction(...d);e.preventDefault()})});let touch=null;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.hypot(dx,dy)>15)direction(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));touch=null});ui();draw();
