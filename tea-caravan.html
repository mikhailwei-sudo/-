<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чайный караван · 万里茶道</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#344c47,#0a181b);color:#f8e6c1;font:15px system-ui,sans-serif}header,main{max-width:1040px;margin:auto;padding:10px 14px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(20px,4vw,29px);margin:3px 0}a{color:#f0c988}.hud{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.hud span{padding:8px 12px;border:1px solid #997b52;background:#213c38;border-radius:9px}#stage{position:relative;max-width:800px;margin:auto;border:4px solid #b38c54;border-radius:12px;overflow:hidden;box-shadow:0 15px 50px #0008}canvas{width:100%;display:block;background:#a9c9b2;image-rendering:pixelated;touch-action:none}#overlay{position:absolute;inset:0;background:#071c20dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#overlay[hidden]{display:none}.panel{max-width:460px;padding:25px;background:#213b38;border:2px solid #c6a064;border-radius:15px}.panel h2{color:#f7d38c;font-size:28px}button,select{padding:11px 15px;background:#365b4a;color:#ffefcc;border:1px solid #c4a06a;border-radius:10px;font:inherit;cursor:pointer}button:active{transform:scale(.96)}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}.controls{display:flex;justify-content:space-between;max-width:800px;margin:10px auto;gap:10px}.controls button{min-width:85px;font-size:24px;touch-action:none}.tip{text-align:center;color:#d6d2b2}@media(min-width:850px){.controls{display:none}}@media(max-width:550px){.controls button{min-width:70px}.panel{padding:15px}.panel h2{font-size:23px}}</style></head><body><header><h1>🐪 Чайный караван · 万里茶道</h1><a href="tea-adventure.html">← Приключение</a></header><main><div class="hud"><span id="country">🇨🇳 Китай</span><span id="distance">0%</span><span id="health">❤️❤️❤️</span><span id="clock">00:00</span><span id="points">0</span></div><div id="stage"><canvas id="game" width="800" height="600"></canvas><div id="overlay"><div class="panel"><h2 id="heading">🐪 Великий чайный караван</h2><p id="description">Проведи караван через Китай, Монголию и Россию. Уворачивайся от препятствий и собирай чайные печати!</p><div class="choices"><label>Сложность <select id="difficulty"><option value="0">Ученик</option><option value="1">Мастер</option><option value="2">Эксперт</option></select></label><label>Язык <select id="language"><option value="ru">Русский</option><option value="zh">中文</option><option value="en">English</option></select></label></div><button id="start">Начать путь →</button></div></div></div><div class="controls"><button id="left" aria-label="Влево">◀</button><button id="slow" aria-label="Замедлить">🐪</button><button id="right" aria-label="Вправо">▶</button></div><p class="tip" id="help">← → / A D — управлять караваном · ↓ / S — притормозить · на телефоне — кнопки или свайпы</p></main><script>
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id),W=800,H=600;
const langs={ru:{title:'🐪 Великий чайный караван',desc:'Проведи караван через Китай, Монголию и Россию. Уворачивайся от препятствий и собирай чайные печати!',go:'Начать путь →',again:'Играть снова',win:'🏆 Чай доставлен в Россию!',lose:'💔 Караван не добрался',countries:['🇨🇳 Китай','🇲🇳 Монголия','🇷🇺 Россия'],diff:['Ученик','Мастер','Эксперт'],help:'← → / A D — управлять караваном · ↓ / S — притормозить · на телефоне — кнопки или свайпы'},zh:{title:'🐪 万里茶道驼队',desc:'穿越中国、蒙古和俄罗斯！躲避障碍，收集茶叶印章。',go:'开始旅程 →',again:'再玩一次',win:'🏆 茶叶成功运抵俄罗斯！',lose:'💔 驼队未能抵达',countries:['🇨🇳 中国','🇲🇳 蒙古','🇷🇺 俄罗斯'],diff:['学徒','师傅','专家'],help:'← → / A D 控制驼队 · ↓ / S 减速 · 手机可使用按钮或滑动'},en:{title:'🐪 The Great Tea Caravan',desc:'Guide your caravan across China, Mongolia and Russia! Dodge hazards and collect tea seals.',go:'Begin journey →',again:'Play again',win:'🏆 Tea delivered to Russia!',lose:'💔 The caravan was lost',countries:['🇨🇳 China','🇲🇳 Mongolia','🇷🇺 Russia'],diff:['Apprentice','Master','Expert'],help:'← → / A D steer · ↓ / S slow down · mobile buttons or swipe'}};
let language='ru',difficulty=0,mode='menu',distance=0,health=3,points=0,elapsed=0,last=0,frame=0,objects=[],dust=[],spawn=0,invincible=0,lane=1,targetLane=1,camelX=400,keys=new Set(),touchDir=0,slow=false,scroll=0,transition=0,region=-1;
const tracks=[275,400,525],regions=[{sky:'#f7ba75',far:'#a78c74',hill:'#b68b57',earth:'#d6a76d',road:'#ab7952'},{sky:'#9ed4df',far:'#7b9b89',hill:'#a6b477',earth:'#c9bb7f',road:'#a59169'},{sky:'#a9c9df',far:'#7791a4',hill:'#73937d',earth:'#b4b7a1',road:'#777c74'}];
const total=[70,85,100],speed=[225,270,315],spawnGap=[1.12,.89,.72];
function text(str,x,y,size=18,color='#fff0d3'){g.fillStyle=color;g.font='bold '+size+'px system-ui';g.textAlign='center';g.fillText(str,x,y)}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function poly(points,color){g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fill()}
function camel(x,y,scale=1,phase=0,leader=false){g.save();g.translate(x,y);g.scale(scale,scale);ellipse(0,17,48,10,'#3c302a55');const sway=Math.sin(phase*9)*4;for(const dx of [-23,20]){rect(dx,-1,11,37+sway*(dx>0?1:-1),'#755039');rect(dx+2,28+sway*(dx>0?1:-1),11,6,'#4b352c')}ellipse(0,-13,40,23,'#bb8350');ellipse(-17,-31,18,23,'#b98650');ellipse(13,-32,17,23,'#bd8b57');poly([[25,-23],[43,-56],[55,-54],[44,-11]],'#b98650');ellipse(48,-58,14,11,'#bd8b57');ellipse(57,-56,8,5,'#a16b43');ellipse(49,-61,2.5,2.5,'#201d18');poly([[40,-65],[40,-82],[49,-70]],'#9c6842');poly([[-32,-13],[-51,-29],[-55,-24],[-39,0]],'#a7764d');rect(-27,-20,47,27,'#a03d32');rect(-24,-17,41,20,'#e2b76b');rect(-16,-16,25,19,leader?'#3e7b82':'#9b3932');rect(-2,-18,5,23,'#e5cc86');rect(-26,1,49,6,'#67482e');g.restore()}
function background(t,dt){const r=regions[t];rect(0,0,W,H,r.sky);const sunX=t===0?610:t===1?160:640;ellipse(sunX,94,42,42,t===2?'#f4f4df':'#ffde9b');for(let j=0;j<7;j++){const x=((j*187-scroll*.1)%(W+240)+(W+240))%(W+240)-120;ellipse(x,65+j%3*31,70,16,'#ffffff44')}for(let i=-1;i<8;i++){const x=i*155-scroll*.19%155;poly([[x,315],[x+100,126+(i*47)%80],[x+225,315]],r.far)}for(let i=-1;i<10;i++){const x=i*120-scroll*.34%120;poly([[x,350],[x+60,230+(i*19)%65],[x+150,350]],r.hill)}rect(0,340,W,260,r.earth);const drift=scroll%115;for(let i=-1;i<10;i++){const x=i*115-drift;if(t===0){rect(x+20,377,8,23,'#74593d');ellipse(x+23,368,22,13,'#587b45');ellipse(x+9,375,15,10,'#72954e')}else if(t===1){for(let j=0;j<3;j++){rect(x+j*20,370+j%2*28,3,15,'#6b8753');ellipse(x+j*20,368+j%2*28,7,3,'#b1a36b')}}else{rect(x+28,370,9,43,'#675d4a');for(let k=0;k<3;k++)poly([[x+4+k*4,390-k*17],[x+32,328-k*15],[x+60-k*4,390-k*17]],'#396957')}}poly([[200,600],[600,600],[558,335],[240,335]],r.road);for(let i=0;i<3;i++){const x=268+i*132;g.strokeStyle='#e8d5a366';g.lineWidth=3;g.setLineDash([18,21]);g.lineDashOffset=-scroll*.8;g.beginPath();g.moveTo(x,340);g.lineTo(x+(i-1)*26,600);g.stroke();g.setLineDash([])}for(let i=0;i<17;i++){const yy=340+(i*41+scroll*.7)%260;const xx=220+(i*97)%360;rect(xx,yy,8,2,'#ffe5ac44')}if(t===0){for(let j=0;j<3;j++){const x=(j*310-scroll*.4+1200)%1100-150;rect(x,275,12,72,'#6d4c37');poly([[x-24,277],[x+6,232],[x+36,277]],'#ba5e3e');rect(x-12,295,36,5,'#f4cb8c')}}if(t===2){for(let j=0;j<3;j++){const x=(j*360-scroll*.35+1200)%1100-150;rect(x,300,95,45,'#9b6b4a');poly([[x-12,300],[x+47,263],[x+106,300]],'#794c40');rect(x+42,314,18,31,'#443f35')}}}
function obstacle(o){const x=tracks[o.lane],y=o.y;ellipse(x,y+14,35,9,'#3d312b55');if(o.type==='rock'){poly([[x-34,y+7],[x-27,y-20],[x-5,y-31],[x+28,y-12],[x+34,y+10]],'#675d55');poly([[x-25,y-16],[x-5,y-30],[x+4,y-9]],'#a69b88')}else if(o.type==='cart'){rect(x-35,y-22,70,31,'#925936');rect(x-33,y-24,65,8,'#e0ad69');for(const dx of [-24,23])ellipse(x+dx,y+10,11,11,'#4b382b');rect(x-25,y-34,50,12,'#6b8a49')}else if(o.type==='storm'){for(let i=0;i<6;i++)ellipse(x+Math.sin(elapsed*6+i)*21,y-20+i*7,24,15,'#8b795cbb')}else if(o.type==='seal'){ellipse(x,y-14,17,18,'#e8bf58');text('茶',x,y-8,20,'#8a4431')}}
function updateHud(){const t=langs[language];$('country').textContent=t.countries[Math.min(2,Math.floor(distance/total[difficulty]*3))];$('distance').textContent=Math.floor(distance/total[difficulty]*100)+'%';$('health').textContent='❤️'.repeat(health)+'🖤'.repeat(3-health);$('clock').textContent=Math.floor(elapsed/60).toString().padStart(2,'0')+':'+Math.floor(elapsed%60).toString().padStart(2,'0');$('points').textContent='⭐ '+points}
function translate(){const t=langs[language];$('heading').textContent=t.title;$('description').textContent=t.desc;$('start').textContent=t.go;$('help').textContent=t.help;for(let i=0;i<3;i++)$('difficulty').options[i].text=t.diff[i];updateHud()}
function start(){language=$('language').value;difficulty=+$('difficulty').value;distance=0;health=3;points=0;elapsed=0;spawn=0;invincible=0;lane=1;targetLane=1;camelX=400;objects=[];dust=[];scroll=0;transition=2;region=-1;mode='playing';$('overlay').hidden=true;last=performance.now();cancelAnimationFrame(frame);frame=requestAnimationFrame(tick)}
function end(win){mode='finished';$('overlay').hidden=false;$('heading').textContent=win?langs[language].win:langs[language].lose;$('description').textContent='⭐ '+points+' · '+Math.floor(distance/total[difficulty]*100)+'%';$('start').textContent=langs[language].again;if(win){try{sessionStorage.setItem('teaAdventureStage','4')}catch(e){}if(window.parent!==window)window.parent.postMessage({type:'tea-stage-complete',stage:3},location.origin)}}
function tick(now){if(mode!=='playing')return;const dt=Math.min(.045,(now-last)/1000);last=now;elapsed+=dt;const pace=keys.has('ArrowDown')||keys.has('s')||slow?.6:1;const v=speed[difficulty]*pace;scroll+=v*dt;distance+=dt*pace;if(distance>=total[difficulty]){distance=total[difficulty];updateHud();render();end(true);return}const t=Math.min(2,Math.floor(distance/total[difficulty]*3));if(t!==region){region=t;transition=2.5}transition=Math.max(0,transition-dt);let dir=(keys.has('ArrowLeft')||keys.has('a')?-1:0)+(keys.has('ArrowRight')||keys.has('d')?1:0)+touchDir;if(dir!==0){targetLane=Math.max(0,Math.min(2,targetLane+Math.sign(dir)));touchDir=0;keys.delete('ArrowLeft');keys.delete('ArrowRight');keys.delete('a');keys.delete('d')}camelX+=(tracks[targetLane]-camelX)*Math.min(1,dt*11);spawn-=dt;if(spawn<=0){spawn=spawnGap[difficulty]*(.7+Math.random()*.6);const l=Math.floor(Math.random()*3);objects.push({lane:l,y:315,type:Math.random()<.23?'seal':['rock','cart','storm'][Math.floor(Math.random()*3)],hit:false})}for(const o of objects){o.y+=v*dt*1.1;if(!o.hit&&o.y>485&&o.y<568&&Math.abs(tracks[o.lane]-camelX)<57){o.hit=true;if(o.type==='seal')points+=100;else if(invincible<=0){health--;invincible=1.3;if(health<=0){updateHud();render();end(false);return}}}}objects=objects.filter(o=>o.y<650);invincible=Math.max(0,invincible-dt);updateHud();render();frame=requestAnimationFrame(tick)}
function render(){const t=Math.min(2,Math.floor(distance/total[difficulty]*3));background(t);for(const o of objects)obstacle(o);for(let i=2;i>=0;i--){const y=510+i*24;g.globalAlpha=i===0&&invincible>0&&Math.floor(elapsed*12)%2===0?.3:1;camel(camelX-i*18,y,1-i*.13,elapsed+i,i===0)}g.globalAlpha=1;if(transition>0){g.fillStyle='#112d2dbb';g.fillRect(175,20,450,64);text(langs[language].countries[t],400,61,30,'#ffe4a0')}text('🍃 '+Math.floor(distance/total[difficulty]*100)+'%',400,110,22,'#fff4d5')}
$('start').onclick=start;$('language').onchange=()=>{language=$('language').value;translate()};$('difficulty').onchange=translate;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown',' ','ArrowUp'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase().length===1?e.key.toLowerCase():e.key)});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().length===1?e.key.toLowerCase():e.key));for(const [id,dir] of [['left',-1],['right',1]])$(id).addEventListener('pointerdown',e=>{e.preventDefault();touchDir=dir});$('slow').addEventListener('pointerdown',()=>slow=true);for(const ev of ['pointerup','pointercancel','pointerleave'])$('slow').addEventListener(ev,()=>slow=false);let touchX=null;c.addEventListener('pointerdown',e=>touchX=e.clientX);c.addEventListener('pointerup',e=>{if(touchX!==null){const d=e.clientX-touchX;if(Math.abs(d)>25)touchDir=Math.sign(d);touchX=null}});try{const l=sessionStorage.getItem('teaAdventureLanguage');if(l&&langs[l]){$('language').value=l;language=l}}catch(e){}translate();render();
</script></body></html>
