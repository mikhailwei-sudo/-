function updateHud(){const t=langs[language];$('country').textContent=t.countries[Math.min(2,Math.floor(distance/total[difficulty]*3))];$('distance').textContent=Math.floor(distance/total[difficulty]*100)+'%';$('health').textContent='❤️'.repeat(health)+'🖤'.repeat(3-health);$('clock').textContent=Math.floor(elapsed/60).toString().padStart(2,'0')+':'+Math.floor(elapsed%60).toString().padStart(2,'0');$('points').textContent='⭐ '+points;$('power').textContent='🛡️ '+charges+' · ⚡ '+Math.ceil(boost)}

function start(){language=$('language').value;difficulty=+$('difficulty').value;distance=0;cutIndex=0;cutTime=0;sceneBlend=0;previousRegion=0;health=3;points=0;shield=0;magnet=0;boost=0;charges=0;fx=[];confetti=[];floating=[];teaStreak=0;teaStreakTime=0;shake=0;abilityTime=0;elapsed=0;spawn=0;invincible=0;lane=1;targetLane=1;camelX=400;objects=[];dust=[];scroll=0;transition=2;region=-1;mode='playing';$('overlay').hidden=true;last=performance.now();cancelAnimationFrame(frame);frame=requestAnimationFrame(tick)}

function tick(now){if(mode!=='playing')return;const dt=Math.min(.045,(now-last)/1000);last=now;elapsed+=dt;const pace=(keys.has('ArrowDown')||keys.has('s')||slow)?.6:1;const v=speed[difficulty]*pace*(boost>0?1.15:1);boost=Math.max(0,boost-dt);shield=Math.max(0,shield-dt);teaStreakTime=Math.max(0,teaStreakTime-dt);shake=Math.max(0,shake-dt*35);scroll+=v*dt;distance+=dt*pace;if(distance>=total[difficulty]){distance=total[difficulty];end(true);return}const t=Math.min(2,Math.floor(distance/total[difficulty]*3));if(t!==region){previousRegion=Math.max(0,region);sceneBlend=region<0?0:1;region=t;transition=2.5}sceneBlend=Math.max(0,sceneBlend-dt*.6);transition=Math.max(0,transition-dt);let dir=(keys.has('ArrowLeft')||keys.has('a')?-1:0)+(keys.has('ArrowRight')||keys.has('d')?1:0)+touchDir;if(dir!==0){targetLane=Math.max(0,Math.min(2,targetLane+Math.sign(dir)));touchDir=0;keys.delete('ArrowLeft');keys.delete('ArrowRight');keys.delete('a');keys.delete('d')}camelX+=(tracks[targetLane]-camelX)*Math.min(1,dt*11);spawn-=dt;if(spawn<=0){spawn=spawnGap[difficulty]*(.7+Math.random()*.6);const l=Math.floor(Math.random()*3);const bonus=Math.random()<.34;const loot=['seal','seal','shield','speed','heart'];objects.push({lane:l,y:315,type:bonus?loot[Math.floor(Math.random()*loot.length)]:['rock','cart','storm'][Math.floor(Math.random()*3)],hit:false})}for(const o of objects){o.y+=v*dt*1.1;if(!o.hit&&o.y>485&&o.y<568&&Math.abs(tracks[o.lane]-camelX)<57){o.hit=true;if(o.type==='seal'){teaStreak=teaStreakTime>0?teaStreak+1:1;teaStreakTime=6;const reward=100+Math.min(5,teaStreak-1)*25;points+=reward;celebrate(tracks[o.lane],o.y,'🍃 +'+reward,'#f5d56a')}else if(o.type==='shield'){charges=Math.min(3,charges+1);celebrate(tracks[o.lane],o.y,'🛡️ +1','#7edfff')}else if(o.type==='speed'){boost=6;points+=50;celebrate(tracks[o.lane],o.y,'⚡ BOOST','#f5d56a')}else if(o.type==='heart'){health=Math.min(3,health+1);celebrate(tracks[o.lane],o.y,'❤️ +1','#f58f9b')}else if(invincible<=0){if(shield>0){shield=0 const story={ru:['Чаар: Ник, мы наконец добрались до России!','Русский купец: Добро пожаловать! Это чай из Китая?','Ник: Да! Мы прошли через Монголию. Чай доставлен в целости!','Русский купец: Благодарю вас! Пусть Великий чайный путь объединяет наши народы!'],zh:['茶儿：尼克，我们终于到俄罗斯了！','俄罗斯商人：欢迎！这是中国的茶叶吗？','尼克：是的！我们穿过蒙古草原，茶叶平安送达！','俄罗斯商人：谢谢你们！愿万里茶道连接我们的人民！'],en:['Chaer: Nik, we finally reached Russia!','Russian merchant: Welcome! Is that tea from China?','Caravan leader: Yes! Across Mongolia, all bundles are safe.','Russian merchant: Thank you! May the Great Tea Road unite our peoples!']};
function drawPerson(x,y,merchant,phase){g.save();g.translate(x,y+Math.sin(phase)*2);ellipse(0,8,20,5,'#241b1b66');rect(-12,-32,10,34,merchant?'#453b40':'#675140');rect(2,-32,10,34,merchant?'#453b40':'#675140');poly([[-22,-87],[22,-87],[27,-31],[-27,-31]],merchant?'#31576c':'#935b3d');rect(-20,-68,40,6,'#d6b477');ellipse(0,-102,17,20,'#e3b68b');rect(-20,-124,40,9,merchant?'#40372e':'#a85e43');rect(-14,-134,28,13,merchant?'#4c4036':'#b9714b');rect(-8,-105,3,3,'#2d2a28');rect(6,-105,3,3,'#2d2a28');g.strokeStyle='#d3a378';g.lineWidth=9;g.beginPath();g.moveTo(merchant?-18:18,-78);g.lineTo(merchant?-36:36,-55+Math.sin(phase*2)*6);g.stroke();g.restore()}
function drawFinalHero(key,x,y,time){const im=finaleHeroes[key];if(im.complete&&im.naturalWidth>=64){const frame=Math.floor(time*4)%6;g.save();g.imageSmoothingEnabled=false;g.drawImage(im,frame*64,0,64,64,x-40,y-94,80,94);g.restore()}else drawPerson(x,y,key==='nik',time)}
function drawEnding(){g.save();const time=cutIndex*7+cutTime;const sky=g.createLinearGradient(0,0,0,410);sky.addColorStop(0,'#7fa9c0');sky.addColorStop(1,'#f2cf9e');g.fillStyle=sky;g.fillRect(0,0,800,600);ellipse(630,90,48,48,'#f7db9b');for(let i=0;i<9;i++){const x=i*114-50;poly([[x,350],[x+55,190+(i%3)*22],[x+120,350]],'#688078')}rect(0,347,800,253,'#a6a28a');poly([[100,600],[700,600],[580,342],[220,342]],'#b69a74');for(let i=0;i<46;i++){const yy=358+i*13%242,xx=125+(i*137)%550;ellipse(xx,yy,3+(i%4)*2,2+(i%3),'#807762')}rect(70,225,660,168,'#9d6b4d');rect(83,238,634,155,'#d4b081');for(let i=0;i<15;i++){rect(85+i*42,240,3,151,'#aa7b5b');rect(85,246+i*10,630,2,'#bc966c')}poly([[55,236],[400,115],[745,236]],'#673d37');poly([[105,229],[400,141],[695,229]],'#92544a');rect(335,288,130,105,'#593e31');rect(350,304,100,89,'#886345');rect(385,306,30,87,'#b88e62');text('茶 · ЧАЙ',400,256,26,'#613f32');for(let i=0;i<6;i++){const xx=440+i%3*58,yy=407+Math.floor(i/3)*38;rect(xx,yy,50,32,'#79513a');rect(xx+4,yy+4,42,25,'#cda16a');rect(xx+21,yy+3,6,26,'#8c523c');text('茶',xx+25,yy+23,19,'#6e4934')}const arrival=Math.max(0,1-Math.min(1,time/5));camel(220-arrival*270,442,.72,time*.8,true);camel(145-arrival*270,455,.63,time*.8+1,false);drawFinalHero('cha',300,450,time);drawFinalHero('nik',390,452,time+.5);drawPerson(570,442,true,time+.8);g.fillStyle='#142b2bea';g.fillRect(18,478,764,106);text(language==='ru'?'ДОСТАВКА ЧАЯ · РОССИЯ':language==='zh'?'茶叶送达 · 俄罗斯':'TEA DELIVERY · RUSSIA',400,498,15,'#e7c38b');const line=story[language][cutIndex];const chars=language==='zh'?22:48;const shown=line.slice(0,Math.min(line.length,Math.floor(cutTime*24)));const mid=shown.length>chars?(shown.lastIndexOf(' ',chars)>chars/2?shown.lastIndexOf(' ',chars):chars):shown.length;text(shown.slice(0,mid).trim(),400,530,18,'#fff0c7');if(shown.length>mid)text(shown.slice(mid).trim(),400,555,18,'#fff0c7');g.restore()}
function endingFrame(now){if(mode!=='cinematic')return;const dt=Math.min(.05,(now-last)/1000);last=now;cutTime+=dt;scroll+=dt*24;drawEnding();if(cutTime>=7){cutTime=0;cutIndex++;if(cutIndex>=4){end(true);return}}frame=requestAnimationFrame(endingFrame)}
function flash(x,y,color){fx.push({x,y,color,life:.55,radius:12})}function activate(){if(mode!=='playing'||charges<1||shield>0)return;charges--;shield=7;flash(camelX,520,'#87e6ff')}
function render(){g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const t=Math.min(2,Math.floor(distance/total[difficulty]*3));background(t);scenery(t);if(sceneBlend>0){g.save();g.globalAlpha=sceneBlend;g.translate(-W*(1-sceneBlend),0);background(previousRegion);scenery(previousRegion);g.restore()}for(const o of objects)obstacle(o);g.save();g.strokeStyle='#d5bb86';g.lineWidth=3;g.setLineDash([7,5]);g.lineDashOffset=-elapsed*12;g.beginPath();g.moveTo(camelX,476);g.lineTo(camelX,500);g.moveTo(camelX,421);g.lineTo(camelX,445);g.stroke();g.setLineDash([]);g.restore();for(let i=2;i>=0;i--){const y=538-i*55;g.globalAlpha=invincible>0&&Math.floor(elapsed*12)%2===0?.5:1;camel(camelX+Math.sin(elapsed*2+i)*2,y,(.88-i*.12),elapsed+i*.55,i===0)}g.globalAlpha=1;if(boost>0){for(let j=0;j<10;j++){const x=200+j*43+Math.sin(elapsed*6+j)*12;const y=350+(elapsed*190+j*67)%250;rect(x,y,3,15,'#fff2aa77')}}if(shield>0){g.strokeStyle='#7de5ff';g.lineWidth=5;g.beginPath();g.ellipse(camelX,493,47+Math.sin(elapsed*9)*3,82,0,0,Math.PI*2);g.stroke()}for(const f of fx){g.globalAlpha=Math.max(0,f.life/.55);g.strokeStyle=f.color;g.lineWidth=5;g.beginPath();g.arc(f.x,f.y,f.radius,0,Math.PI*2);g.stroke()}g.globalAlpha=1;for(const p of confetti){g.globalAlpha=Math.min(1,p.life*1.5);rect(p.x,p.y,p.size,p.size,p.color)}g.globalAlpha=1;for(const p of floating){g.globalAlpha=Math.min(1,p.life);text(p.label,p.x,p.y,24,p.color)}g.globalAlpha=1;if(teaStreakTime>0&&teaStreak>=2)text('🍃 COMBO x'+teaStreak,400,148,24,'#ffe49b');if(transition>0){g.fillStyle='#112d2dbb';g.fillRect(175,20,450,64);text(langs[language].countries[t],400,61,30,'#ffe4a0')}text('🍃 '+Math.floor(distance/total[difficulty]*100)+'%',400,110,22,'#fff4d5');g.restore()}
c.addEventListener('click',()=>{if(mode==='cinematic'){cutTime=7}});$('start').onclick=start;$('ability').onclick=activate;$('language').onchange=()=>{language=$('language').value;translate()};$('difficulty').onchange=translate;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown',' ','ArrowUp'].includes(e.key))e.preventDefault();if(e.key===' '){activate();return}keys.add(e.key.toLowerCase().length===1?e.key.toLowerCase():e.key)});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().length===1?e.key.toLowerCase():e.key));for(const [id,dir] of [['left',-1],['right',1]])$(id).addEventListener('pointerdown',e=>{e.preventDefault();touchDir=dir});$('slow').addEventListener('pointerdown',()=>slow=true);for(const ev of ['pointerup','pointercancel','pointerleave'])$('slow').addEventListener(ev,()=>slow=false);let touchX=null;c.addEventListener('pointerdown',e=>touchX=e.clientX);c.addEventListener('pointerup',e=>{if(touchX!==null){const d=e.clientX-touchX;if(Math.abs(d)>25)touchDir=Math.sign(d);touchX=null}});try{const l=sessionStorage.getItem('teaAdventureLanguage');if(l&&langs[l]){$('language').value=l;language=l}}catch(e){}translate();render();if(new URLSearchParams(location.search).get('preview')==='ending'){distance=total[difficulty];region=2;transition=0;startEnding()}
</script></body></html>
