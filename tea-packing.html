function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#5a6a52';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=32)for(let x=0;x<W;x+=32){ctx.fillStyle=(x/32+y/32)%2===0?'#9a9876':'#a5a082';ctx.fillRect(x,y,31,31);ctx.fillStyle='#858566';ctx.fillRect(x,y,31,1)}ctx.fillStyle='#543728';ctx.fillRect(0,0,W,105);ctx.fillStyle='#76513b';ctx.fillRect(0,92,W,17);for(let x=0;x<W;x+=190){ctx.fillStyle='#392a24';ctx.fillRect(x,0,19,105);ctx.fillStyle='#b18a55';ctx.fillRect(x+3,0,3,105);ctx.font='34px serif';ctx.save();ctx.shadowColor='#ff9f3e';ctx.shadowBlur=16+Math.sin(elapsed*3+x)*5;ctx.fillText('🏮',x+42,70);ctx.restore()}for(let x=90;x<W;x+=230){roundRect(x,17,125,55,4,'#2c4a3c','#bd9254');txt('茶 · 茶道',x+62,52,20,'#e5bd73')}for(let i=0;i<7;i++){const x=36+i*145;ctx.font='29px serif';ctx.fillText(i%2?'🪴':'🏺',x,118)}roundRect(280,310,395,60,8,'#7c4c38','#d2a36c');roundRect(300,321,355,37,5,'#a77450');txt('万 里 茶 道',480,347,25,'#ffdda1');for(const s of stations)drawStation(s);for(const [x,y] of [[34,300],[895,300],[34,535],[890,535]]){ctx.font='43px serif';ctx.fillText('🪴',x,y)}ctx.fillStyle='#855d42';ctx.fillRect(0,590,W,50);for(let x=0;x<W;x+=55){ctx.fillStyle='#654631';ctx.fillRect(x,595,45,35)}for(const v of particles){ctx.globalAlpha=Math.min(1,v.life);ctx.fillStyle=v.color;ctx.beginPath();ctx.arc(v.x,v.y,3.5,0,7);ctx.fill()}ctx.globalAlpha=1;drawPlayer();if(state==='playing'){const s=nearest();if(s){txt('E / ✋',s.x+s.w/2,s.y+s.h+26,16,'#fff0ae')}}}
function tick(now){if(state!=='playing')return;const dt=Math.min(.045,(now-last)/1000);last=now;elapsed+=dt;time-=dt;if(time<=0){time=0;finish(false);draw();hud();return}let dx=stick.x,dy=stick.y;if(keys.has('ArrowLeft')||keys.has('a'))dx-=1;if(keys.has('ArrowRight')||keys.has('d'))dx+=1;if(keys.has('ArrowUp')||keys.has('w'))dy-=1;if(keys.has('ArrowDown')||keys.has('s'))dy+=1;const len=Math.hypot(dx,dy);if(len>.01){const speed=210;p.x=Math.max(35,Math.min(W-35,p.x+dx/Math.max(1,len)*speed*dt));p.y=Math.max(133,Math.min(H-35,p.y+dy/Math.max(1,len)*speed*dt));for(const s of stations){const px=Math.max(s.x-19,Math.min(p.x,s.x+s.w+19)),py=Math.max(s.y-19,Math.min(p.y,s.y+s.h+19));if(Math.abs(p.x-px)<1&&Math.abs(p.y-py)<1){const dL=Math.abs(p.x-(s.x-20)),dR=Math.abs(p.x-(s.x+s.w+20)),dT=Math.abs(p.y-(s.y-20)),dB=Math.abs(p.y-(s.y+s.h+20));const m=Math.min(dL,dR,dT,dB);if(m===dL)p.x=s.x-20;else if(m===dR)p.x=s.x+s.w+20;else if(m===dT)p.y=s.y-20;else p.y=s.y+s.h+20}}}if(working>=0)workingTime=Math.max(0,workingTime-dt);for(const v of particles){v.x+=v.vx*dt;v.y+=v.vy*dt;v.vy+=80*dt;v.life-=dt}particles=particles.filter(v=>v.life>0);if(messageTime>0){messageTime-=dt;if(messageTime<=0)$('notice').textContent=t().steps[step]}draw();hud();frame=requestAnimationFrame(tick)}
$('play').onclick=start;$('restart').onclick=start;$('action').addEventListener('pointerdown',e=>{e.preventDefault();action()});$('lang').onchange=()=>{lang=$('lang').value;translate();msg(t().steps[step])};$('hero').onchange=()=>hero=$('hero').value;
document.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','e','w','a','s','d'].includes(k)){if(e.target.tagName==='SELECT')return;e.preventDefault();if((k==='e'||k===' ')&&!e.repeat)action();else keys.add(k)}});document.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>{keys.clear();stick={x:0,y:0};$('nub').style.transform='translate(-50%,-50%)'});
const pad=$('stick'),nub=$('nub');function padMove(e){const r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.hypot(x,y),max=r.width*.29;stick={x:m?x/Math.max(max,m):0,y:m?y/Math.max(max,m):0};nub.style.transform='translate(calc(-50% + '+stick.x*max+'px),calc(-50% + '+stick.y*max+'px))'}pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padMove(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(event,()=>{stick={x:0,y:0};nub.style.transform='translate(-50%,-50%)'});translate();draw();
