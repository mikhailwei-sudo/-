function setLanguage(x){lang=x;ui();hud()}function choose(x){hero=x;ui()}function setDifficulty(x){difficulty=x;ui()}function ui(){const t=I[lang];document.documentElement.lang=lang;$('title').textContent=t.title;$('intro').textContent=t.intro;$('pickTitle').textContent=t.pick;$('diffTitle').textContent=t.diff;$('start').textContent=t.start;$('soundText').textContent=t.sound;$('motionText').textContent=t.motion;$('portrait').src=hero===0?'game-assets/chaer.svg':'game-assets/nik.svg';$('mei').classList.toggle('selected',hero===0);$('nik').classList.toggle('selected',hero===1);$('diffs').innerHTML=t.levels.map((s,i)=>'<button class="'+(difficulty===i?'selected':'')+'" onclick="setDifficulty('+i+')">'+s+'</button>').join('');$('pause').textContent=t.pause;$('restart').textContent=t.restart;$('help').textContent=t.help;$('footer').textContent=t.footer}

function makeMaze(){maze=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x===0||y===0||x===20||y===20?'#':' '));const walls=[[3,1,3,5],[6,1,6,3],[9,1,9,5],[12,1,12,4],[15,1,15,5],[18,1,18,3],[1,7,5,7],[7,7,12,7],[14,7,19,7],[3,9,3,14],[6,9,6,12],[9,9,9,14],[12,9,12,12],[15,9,15,14],[18,9,18,12],[1,16,5,16],[7,16,12,16],[14,16,19,16],[4,4,7,4],[11,4,14,4],[4,12,7,12],[13,12,16,12]];for(const [x1,y1,x2,y2] of walls){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)maze[y][x]='#'}const open=[];for(let y=1;y<20;y++)for(let x=1;x<20;x++)if(maze[y][x]===' '&&(x!==1||y!==1))open.push(y*N+x);for(let i=open.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[open[i],open[j]]=[open[j],open[i]]}leaves=new Set(open.slice(0,100));const dist=bfs(1,1);const far=[...open].sort((a,b)=>dist[b]-dist[a]);const end=far[0];maze[Math.floor(end/N)][end%N]='E';leaves.delete(end);if(leaves.size<100)for(const v of open)if(v!==end&&!leaves.has(v)){leaves.add(v);break}return far}

function init(){const far=makeMaze();p={x:1,y:1,renderX:1,renderY:1,dx:0,dy:0,wantX:0,wantY:0,angle:0,steps:0};enemies=far.slice(1,1+2+difficulty).map((v,i)=>({x:v%N,y:Math.floor(v/N),renderX:v%N,renderY:Math.floor(v/N),face:0,phase:i*1.6}));score=0;remaining=100;lives=3;time=[240,205,175][difficulty];elapsed=0;invincible=2;shield=0;dash=0;skillWait=0;particles=[];enemyClock=0;moveClock=0;notice='';$('portraitTitle').textContent=lang==='zh'?'茶园迷宫 · 1/3':lang==='en'?'Tea Garden Maze · 1/3':'Чайный лабиринт · 1/3';hud()}

function burst(x,y,color,count=9){if($('motion').checked)return;for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*75;particles.push({x:x*S+16,y:y*S+16,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.4,max:.75,color,r:2+Math.random()*3})}}
function damage(){if(invincible>0||shield>0||state!=='playing')return;lives--;invincible=2.2;burst(p.x,p.y,'#ef7d65',20);sound(170,.3,'sawtooth');if(lives<=0)finish(false);hud()}
function movePlayer(){if(pass(p.x+p.wantX,p.y+p.wantY)){p.dx=p.wantX;p.dy=p.wantY}if(pass(p.x+p.dx,p.y+p.dy)){p.x+=p.dx;p.y+=p.dy;p.steps++;p.angle=p.dx>0?0:p.dx<0?Math.PI:p.dy>0?Math.PI/2:-Math.PI/2;const key=p.y*N+p.x;if(leaves.delete(key)){remaining--;score+=10*(difficulty+1);burst(p.x,p.y,'#b8e789',4);sound(540+(100-remaining)%6*65,.035);if(remaining===0){notice=I[lang].open;noticeLeft=2;sound(1000,.35)}}}const exit=maze[p.y][p.x]==='E';if(exit){if(remaining===0){score+=Math.ceil(time)*3;finish(true)}else if(noticeLeft<=0){notice=I[lang].blocked;noticeLeft=1.2}}for(const e of enemies)if(e.x===p.x&&e.y===p.y)damage()}
function moveEnemies(){const distances=bfs(p.x,p.y);for(const e of enemies){const options=dirs.map(([dx,dy])=>[e.x+dx,e.y+dy,dx,dy]).filter(([x,y])=>pass(x,y));if(!options.length)continue;const chase=Math.random()<[.38,.6,.77][difficulty];if(chase)options.sort((a,b)=>distances[a[1]*N+a[0]]-distances[b[1]*N+b[0]]);const v=chase?options[0]:options[Math.floor(Math.random()*options.length)];e.x=v[0];e.y=v[1];e.face=v[2];if(e.x===p.x&&e.y===p.y)damage()}}
function finish(win){state='finished';$('result').textContent=win?I[lang].win:I[lang].lose;$('details').textContent=I[lang].score+': '+score;$('continue').textContent=I[lang].again;$('overlay').classList.remove('hidden');sound(win?920:240,.25)}

function drawSprite(img,x,y,w,h,flip=false){if(!img.complete||!img.naturalWidth)return false;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();return true}

function (tileImage(decorativeAssets[0],X,Y,32,32)||shrub(X,Y,x,y)){const seed=x*31+y*17;ctx.fillStyle='#122c24';ctx.fillRect(X+1,Y+7,31,25);for(let k=0;k<7;k++){const xx=X+5+(k*13+seed)%24,yy=Y+5+(k*9+seed)%20;ctx.fillStyle=['#315a3e','#42744c','#558451','#739253'][k%4];ctx.beginPath();ctx.arc(xx,yy,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#254f37';ctx.lineWidth=1;ctx.stroke()}ctx.fillStyle='#91a66a';ctx.fillRect(X+6,Y+4,6,2)}

function sakura(x,y){if(tileImage(decorativeAssets[3],x-38,y-49,76,94))return;ctx.fillStyle='#3b302e';ctx.fillRect(x-5,y-5,11,37);for(let k=0;k<12;k++){let a=k*2.4,r=12+(k%3)*5;ctx.fillStyle=['#a35d76','#c27b8e','#d89bab','#8d506c'][k%4];ctx.beginPath();ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,11,0,7);ctx.fill()}}
function gate(x,y){ctx.fillStyle=remaining===0?'#ffdb83':'#8a7250';ctx.shadowColor=remaining===0?'#ffd67a':'transparent';ctx.shadowBlur=remaining===0?18:0;ctx.fillRect(x+3,y+4,26,28);ctx.shadowBlur=0;ctx.fillStyle='#38282b';ctx.fillRect(x+8,y+9,16,23);ctx.fillStyle='#e7b96d';ctx.fillRect(x+2,y+2,28,5);ctx.fillRect(x+7,y+12,3,18);ctx.fillRect(x+22,y+12,3,18)}
function drawMap(){mctx.fillStyle='#0d1c1a';mctx.fillRect(0,0,210,210);for(let y=0;y<N;y++)for(let x=0;x<N;x++){mctx.fillStyle=maze[y][x]==='#'?'#284b3c':'#8d8d71';mctx.fillRect(x*10,y*10,10,10);if(leaves.has(y*N+x)){mctx.fillStyle='#a6d96a';mctx.fillRect(x*10+4,y*10+4,3,3)}if(maze[y][x]==='E'){mctx.fillStyle='#f0bc64';mctx.fillRect(x*10+1,y*10+1,8,8)}}for(const e of enemies){mctx.fillStyle='#ed7666';mctx.fillRect(e.x*10+2,e.y*10+2,6,6)}mctx.fillStyle='#7fc7ef';mctx.beginPath();mctx.arc(p.x*10+5,p.y*10+5,5,0,7);mctx.fill()}
function draw(){ctx.fillStyle='#273d35';ctx.fillRect(0,0,672,672);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const X=x*S,Y=y*S,v=maze[y][x],seed=x*17+y*23;if(v==='#'){ctx.fillStyle='#1a342a';ctx.fillRect(X,Y,32,32);shrub(X,Y,x,y)}else{if(!tileImage(decorativeAssets[1],X,Y,32,32)){ctx.fillStyle=(x+y)%2?'#8b8a76':'#999680';ctx.fillRect(X,Y,32,32)}ctx.strokeStyle='#645e50';ctx.globalAlpha=.22;ctx.strokeRect(X+1,Y+1,30,30);ctx.globalAlpha=1;if(seed%4===0){ctx.fillStyle='#b5ac91';ctx.fillRect(X+8,Y+7,4,2)}if(seed%9===0){ctx.fillStyle='#7e806e';ctx.fillRect(X+20,Y+24,5,3)}if(leaves.has(y*N+x)){ctx.save();ctx.translate(X+16,Y+16);ctx.rotate(-.6+Math.sin(elapsed*2+x)*.08);ctx.shadowColor='#9fd96b';ctx.shadowBlur=6;ctx.fillStyle='#9dd45d';ctx.beginPath();ctx.ellipse(0,0,9,5,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#447b38';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke();ctx.restore()}}if(v==='E')gate(X,Y)}

function tick(now){if(state!=='playing')return;const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;time-=dt;skillWait=Math.max(0,skillWait-dt);shield=Math.max(0,shield-dt);dash=Math.max(0,dash-dt);invincible=Math.max(0,invincible-dt);noticeLeft=Math.max(0,noticeLeft-dt);if(noticeLeft===0)notice='';if(time<=0){finish(false);draw();return}const smooth=Math.min(1,dt*24);p.renderX+=(p.x-p.renderX)*smooth;p.renderY+=(p.y-p.renderY)*smooth;for(const e of enemies){e.renderX+=(e.x-e.renderX)*smooth;e.renderY+=(e.y-e.renderY)*smooth}for(const v of particles){v.x+=v.vx*dt;v.y+=v.vy*dt;v.life-=dt}particles=particles.filter(v=>v.life>0);enemyClock+=dt;moveClock+=dt;if(moveClock>=(dash>0?.078:.14)){moveClock=0;movePlayer()}if(enemyClock>=[.39,.30,.24][difficulty]){enemyClock=0;moveEnemies()}draw();hud();if(state==='playing')frameHandle=requestAnimationFrame(tick)}
