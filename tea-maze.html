<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>茶道大冒险 · Tea Maze</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#315440,#0a1d18 70%);font:15px system-ui,sans-serif;color:#f7e9cb}a{color:#f5d18c}header{max-width:960px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}main{max-width:960px;margin:auto;padding:5px 18px 45px}h1{font:clamp(29px,5vw,49px) Georgia,serif;margin:8px 0}.sub{color:#c1d2c4}.panel{background:#19382d;border:1px solid #987f53;border-radius:18px;padding:15px;margin:12px 0}button{font:inherit;cursor:pointer;color:#fbeed3;background:#305440;border:1px solid #c09d62;border-radius:13px;padding:11px 15px;touch-action:manipulation}button.selected,.gold{background:#e5bc76;color:#263b2a;font-weight:800}.pick{display:flex;gap:12px;flex-wrap:wrap}.pick button{flex:1;min-width:140px}.pick img{width:100px;height:110px;object-fit:contain;display:block;margin:auto}.hud{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.hud span{border:1px solid #7b805a;background:#264738;border-radius:14px;padding:9px 13px;font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:15px;align-items:start}.game{position:relative;border:6px solid #b9945c;border-radius:19px;overflow:hidden;box-shadow:0 20px 35px #0006;background:#132c21;touch-action:none}.game canvas{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;background:#0b201be8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}.overlay h2{font:30px Georgia,serif;margin:0}.hidden{display:none!important}.side button{width:100%;margin-bottom:10px}.side p{color:#bfd0bd;line-height:1.6;font-size:13px}.dpad{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:6px;margin:13px auto}.dpad button{min-height:54px;font-size:22px;user-select:none}.progress{height:10px;border-radius:10px;background:#0b2019;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#8bc66b,#f1cf78)}.tip{color:#f6d48b;min-height:24px}.settings{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.settings label{display:flex;align-items:center;gap:6px}.badge{font-size:13px;color:#d2dfc8}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:9px}.side p,.side .progress{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header><a href="index.html">← GREAT TEA ROAD</a><div><button onclick="setLanguage('ru')">RU</button> <button onclick="setLanguage('zh')">中</button> <button onclick="setLanguage('en')">EN</button></div></header><main><h1 id="title"></h1><p class="sub" id="intro"></p><section class="panel" id="setup"><h2 id="pickTitle"></h2><div class="pick"><button id="mei" onclick="choose(0)"><img src="game-assets/chaer.svg" alt="Cha'er">茶儿 · Чаэр</button><button id="nik" onclick="choose(1)"><img src="game-assets/nik.svg" alt="Nik">尼克 · Nik</button></div><p id="diffTitle"></p><div class="pick" id="diffs"></div><div class="settings"><label><input type="checkbox" id="sound" checked> <span id="soundText"></span></label><label><input type="checkbox" id="motion"> <span id="motionText"></span></label></div><p><button class="gold" id="start" onclick="start()"></button></p></section><section id="play" class="hidden"><div class="hud"><span id="leaves"></span><span id="score"></span><span id="lives"></span><span id="time"></span></div><div class="layout"><div><div class="game"><canvas id="canvas" width="672" height="672" aria-label="Top-down tea maze"></canvas><div id="overlay" class="overlay hidden"><h2 id="result"></h2><p id="details"></p><button class="gold" id="continue" onclick="resume()"></button></div></div><div class="dpad"><i></i><button data-dir="up">▲</button><i></i><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p class="tip" id="tip" aria-live="polite"></p></div><aside class="side panel"><button id="skill" onclick="useSkill()"></button><button id="pause" onclick="togglePause()"></button><button id="restart" onclick="restart()"></button><div class="progress"><div id="cooldown"></div></div><p id="help"></p></aside></div></section><p class="badge" id="footer"></p></main><script>
const I={ru:{title:'茶道大冒险 · Чайный лабиринт',intro:'Первый этап: 100 листьев, живой лабиринт, бегущие враги и анимация героев.',pick:'Выбери персонажа',diff:'Сложность',levels:['Прогулка','Приключение','Испытание'],start:'Войти в лабиринт',sound:'Звуковые эффекты',motion:'Меньше анимации',leaf:'Чай',score:'Очки',life:'Жизни',time:'Время',skill:['🍵 Чайный щит','🧭 Рывок'],pause:'Пауза',resume:'Продолжить',restart:'Сначала',help:'Стрелки / WASD / экранные кнопки / свайп. Пробел — способность, P — пауза. Собери 100 листьев и войди в золотые ворота. Противники бегут по коридорам.',win:'Первый этап пройден!',lose:'Попробуй ещё раз!',again:'Играть снова',blocked:'Сначала собери 100 листьев!',open:'Ворота открыты!',footer:'Демонстрация первого этапа · Рекорды и конвейер добавим позднее'},zh:{title:'茶道大冒险 · 茶叶迷宫',intro:'第一关：100片茶叶、迷宫、追逐的敌人和角色奔跑动画。',pick:'选择角色',diff:'难度',levels:['轻松','冒险','挑战'],start:'进入迷宫',sound:'音效',motion:'减少动画',leaf:'茶叶',score:'积分',life:'生命',time:'时间',skill:['🍵 茶之护盾','🧭 冲刺'],pause:'暂停',resume:'继续',restart:'重来',help:'方向键、WASD、屏幕按钮或滑动。空格使用技能，P暂停。收集100片茶叶后进入金色大门。',win:'第一关完成！',lose:'再试一次！',again:'再玩一次',blocked:'先收集100片茶叶！',open:'出口已开启！',footer:'第一关试玩版 · 排行榜和传送带以后添加'},en:{title:'Tea Road Adventure · Tea Maze',intro:'Stage one: 100 tea leaves, a living maze, chasing enemies and animated runners.',pick:'Choose a character',diff:'Difficulty',levels:['Relaxed','Adventure','Challenge'],start:'Enter maze',sound:'Sound effects',motion:'Reduced animation',leaf:'Leaves',score:'Score',life:'Lives',time:'Time',skill:['🍵 Tea shield','🧭 Dash'],pause:'Pause',resume:'Resume',restart:'Restart',help:'Arrows / WASD / on-screen controls / swipe. Space for skill, P to pause. Collect 100 leaves then enter the golden gate.',win:'Stage one complete!',lose:'Try again!',again:'Play again',blocked:'Collect all 100 leaves first!',open:'Gate unlocked!',footer:'Stage-one demo · Rankings and conveyor will come later'}};
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),images=['game-assets/chaer.svg','game-assets/nik.svg','game-assets/tea-spirit.svg','game-assets/tea-bandit.svg'].map(src=>{const i=new Image();i.src=src;return i});const runSheets=['game-assets/chaer-run-sheet.svg','game-assets/nik-run-sheet.svg'].map(src=>{const im=new Image();im.src=src;return im});const N=21,S=32,dirs=[[1,0],[-1,0],[0,1],[0,-1]];
let lang='ru',hero=0,difficulty=1,state='menu',maze=[],leaves=new Set(),p={},enemies=[],particles=[],score=0,remaining=100,lives=3,time=0,elapsed=0,invincible=0,shield=0,dash=0,skillWait=0,last=0,enemyClock=0,frameHandle=0,notice='',noticeLeft=0,audio=null;
function setLanguage(x){lang=x;ui();hud()}function choose(x){hero=x;ui()}function setDifficulty(x){difficulty=x;ui()}function ui(){const t=I[lang];document.documentElement.lang=lang;$('title').textContent=t.title;$('intro').textContent=t.intro;$('pickTitle').textContent=t.pick;$('diffTitle').textContent=t.diff;$('start').textContent=t.start;$('soundText').textContent=t.sound;$('motionText').textContent=t.motion;$('mei').classList.toggle('selected',hero===0);$('nik').classList.toggle('selected',hero===1);$('diffs').innerHTML=t.levels.map((s,i)=>'<button class="'+(difficulty===i?'selected':'')+'" onclick="setDifficulty('+i+')">'+s+'</button>').join('');$('pause').textContent=t.pause;$('restart').textContent=t.restart;$('help').textContent=t.help;$('footer').textContent=t.footer}
function sound(freq=620,dur=.045,type='sine'){if(!$('sound').checked)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);gain.gain.setValueAtTime(.045,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+dur)}catch{}}
function makeMaze(){maze=Array.from({length:N},()=>Array(N).fill('#'));const stack=[[1,1]];maze[1][1]=' ';while(stack.length){const [x,y]=stack[stack.length-1];const options=dirs.map(([dx,dy])=>[x+dx*2,y+dy*2,dx,dy]).filter(([nx,ny])=>nx>0&&nx<N-1&&ny>0&&ny<N-1&&maze[ny][nx]==='#');if(!options.length){stack.pop();continue}const [nx,ny,dx,dy]=options[Math.floor(Math.random()*options.length)];maze[y+dy][x+dx]=' ';maze[ny][nx]=' ';stack.push([nx,ny])}for(let i=0;i<26;i++){const x=1+Math.floor(Math.random()*19),y=1+Math.floor(Math.random()*19);if(maze[y][x]==='#'&&dirs.filter(([dx,dy])=>maze[y+dy]?.[x+dx]===' ').length>=2)maze[y][x]=' '}const open=[];for(let y=1;y<20;y++)for(let x=1;x<20;x++)if(maze[y][x]===' '&&(x!==1||y!==1))open.push(y*N+x);for(let i=open.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[open[i],open[j]]=[open[j],open[i]]}leaves=new Set(open.slice(0,100));const dist=bfs(1,1);const far=[...open].sort((a,b)=>dist[b]-dist[a]);const end=far[0];maze[Math.floor(end/N)][end%N]='E';leaves.delete(end);if(leaves.size<100)for(const v of open)if(v!==end&&!leaves.has(v)){leaves.add(v);break}return far}
function bfs(x,y){const dist=Array(N*N).fill(Infinity),queue=[y*N+x];dist[y*N+x]=0;for(let k=0;k<queue.length;k++){const v=queue[k],cx=v%N,cy=Math.floor(v/N);for(const [dx,dy] of dirs){const nx=cx+dx,ny=cy+dy,n=ny*N+nx;if(nx<0||nx>=N||ny<0||ny>=N||maze[ny][nx]==='#'||dist[n]!==Infinity)continue;dist[n]=dist[v]+1;queue.push(n)}}return dist}
function init(){const far=makeMaze();p={x:1,y:1,renderX:1,renderY:1,dx:0,dy:0,wantX:0,wantY:0,angle:0,steps:0};enemies=far.slice(1,1+2+difficulty).map((v,i)=>({x:v%N,y:Math.floor(v/N),renderX:v%N,renderY:Math.floor(v/N),face:0,phase:i*1.6}));score=0;remaining=100;lives=3;time=[240,205,175][difficulty];elapsed=0;invincible=2;shield=0;dash=0;skillWait=0;particles=[];enemyClock=0;moveClock=0;notice='';hud()}
function pass(x,y){return x>=0&&x<N&&y>=0&&y<N&&maze[y][x]!=='#'}
function hud(){if(state==='menu')return;const t=I[lang];$('leaves').textContent=t.leaf+': '+(100-remaining)+'/100';$('score').textContent=t.score+': '+score;$('lives').textContent=t.life+': '+'❤️'.repeat(Math.max(0,lives));$('time').textContent=t.time+': '+Math.ceil(time);$('skill').textContent=t.skill[hero]+(skillWait>0?' '+Math.ceil(skillWait)+'s':'');$('skill').disabled=skillWait>0||state!=='playing';$('cooldown').style.width=(100*(1-skillWait/16))+'%';$('tip').textContent=notice}
function start(){cancelAnimationFrame(frameHandle);init();$('setup').classList.add('hidden');$('play').classList.remove('hidden');$('overlay').classList.add('hidden');state='playing';last=performance.now();frameHandle=requestAnimationFrame(tick)}
function direction(dx,dy){p.wantX=dx;p.wantY=dy}
function useSkill(){if(state!=='playing'||skillWait>0)return;skillWait=16;if(hero===0){shield=6;burst(p.x,p.y,'#f9da82',18);sound(860,.18)}else{dash=5;burst(p.x,p.y,'#9adbf6',15);sound(680,.14)}hud()}
function burst(x,y,color,count=9){if($('motion').checked)return;for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*75;particles.push({x:x*S+16,y:y*S+16,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.4,max:.75,color,r:2+Math.random()*3})}}
function damage(){if(invincible>0||shield>0||state!=='playing')return;lives--;invincible=2.2;burst(p.x,p.y,'#ef7d65',20);sound(170,.3,'sawtooth');if(lives<=0)finish(false);hud()}
function movePlayer(){if(pass(p.x+p.wantX,p.y+p.wantY)){p.dx=p.wantX;p.dy=p.wantY}if(pass(p.x+p.dx,p.y+p.dy)){p.x+=p.dx;p.y+=p.dy;p.steps++;p.angle=p.dx>0?0:p.dx<0?Math.PI:p.dy>0?Math.PI/2:-Math.PI/2;const key=p.y*N+p.x;if(leaves.delete(key)){remaining--;score+=10*(difficulty+1);burst(p.x,p.y,'#b8e789',4);sound(540+(100-remaining)%6*65,.035);if(remaining===0){notice=I[lang].open;noticeLeft=2;sound(1000,.35)}}}const exit=maze[p.y][p.x]==='E';if(exit){if(remaining===0){score+=Math.ceil(time)*3;finish(true)}else if(noticeLeft<=0){notice=I[lang].blocked;noticeLeft=1.2}}for(const e of enemies)if(e.x===p.x&&e.y===p.y)damage()}
function moveEnemies(){const distances=bfs(p.x,p.y);for(const e of enemies){const options=dirs.map(([dx,dy])=>[e.x+dx,e.y+dy,dx,dy]).filter(([x,y])=>pass(x,y));if(!options.length)continue;const chase=Math.random()<[.38,.6,.77][difficulty];if(chase)options.sort((a,b)=>distances[a[1]*N+a[0]]-distances[b[1]*N+b[0]]);const v=chase?options[0]:options[Math.floor(Math.random()*options.length)];e.x=v[0];e.y=v[1];e.face=v[2];if(e.x===p.x&&e.y===p.y)damage()}}
function finish(win){state='finished';$('result').textContent=win?I[lang].win:I[lang].lose;$('details').textContent=I[lang].score+': '+score;$('continue').textContent=I[lang].again;$('overlay').classList.remove('hidden');sound(win?920:240,.25)}
function resume(){if(state==='finished'){start();return}if(state==='paused'){state='playing';$('overlay').classList.add('hidden');last=performance.now();frameHandle=requestAnimationFrame(tick)}}
function togglePause(){if(state==='playing'){state='paused';$('result').textContent=I[lang].pause;$('details').textContent='';$('continue').textContent=I[lang].resume;$('overlay').classList.remove('hidden')}else if(state==='paused')resume()}
function restart(){start()}
function drawSprite(img,x,y,w,h,flip=false){if(!img.complete||!img.naturalWidth)return false;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();return true}
function draw(){ctx.fillStyle='#142c22';ctx.fillRect(0,0,672,672);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const X=x*S,Y=y*S,v=maze[y][x];if(v==='#'){ctx.fillStyle='#244832';ctx.fillRect(X,Y,32,32);ctx.fillStyle='#426e42';ctx.fillRect(X+2,Y+2,28,26);ctx.fillStyle='#659257';ctx.fillRect(X+3,Y+3,26,7);ctx.fillStyle='#2b5235';ctx.fillRect(X+4,Y+24,24,5);if((x*7+y*13)%11===0){ctx.fillStyle='#a2c06e';ctx.beginPath();ctx.arc(X+16,Y+12,3,0,7);ctx.fill()}}else{ctx.fillStyle=(x+y)%2?'#1b3b2b':'#1e402f';ctx.fillRect(X,Y,S,S);if(leaves.has(y*N+x)){ctx.save();ctx.translate(X+16,Y+16);ctx.rotate(-.65);ctx.fillStyle='#b3df7d';ctx.beginPath();ctx.ellipse(0,0,7,4,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4c8846';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);ctx.stroke();ctx.restore()}}if(v==='E'){ctx.fillStyle=remaining===0?'#ffd676':'#7f7555';ctx.fillRect(X+3,Y+2,26,30);ctx.fillStyle='#403625';ctx.fillRect(X+9,Y+9,14,23);ctx.fillStyle='#fff3c3';ctx.fillRect(X+14,Y+7,4,4)}}for(const e of enemies){const x=e.renderX*S+16,y=e.renderY*S+16;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+12,13,5,0,0,7);ctx.fill();const bob=$('motion').checked?0:Math.sin(elapsed*14+e.phase)*2;if(!drawSprite(images[3],x,y-4+bob,38,45,e.face<0)){ctx.font='28px serif';ctx.fillText('👹',x-14,y+10)}}const x=p.renderX*S+16,y=p.renderY*S+16;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+13,15,5,0,0,7);ctx.fill();const running=p.dx!==0||p.dy!==0;const phase=$('motion').checked?0:Math.sin(elapsed*19);const facing=p.dy>0?0:p.dy<0?1:p.dx<0?2:3;const frame=$('motion').checked?0:Math.floor(elapsed*11)%4;const atlas=runSheets[hero];if(atlas.complete&&atlas.naturalWidth){ctx.save();ctx.translate(x,y);ctx.drawImage(atlas,frame*64,facing*64,64,64,-24,-27+Math.abs(phase)*-1,48,48);ctx.restore()}else{ctx.save();ctx.translate(x,y);if(p.dx<0)ctx.scale(-1,1);drawSprite(images[hero],0,-4,40,48);ctx.restore()}if(invincible>0||shield>0){ctx.strokeStyle=shield>0?'#f9d878':'#b6e5f3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,23+Math.sin(elapsed*7)*2,0,7);ctx.stroke()}if(images[2].complete&&images[2].naturalWidth)drawSprite(images[2],x+22,y-23+Math.sin(elapsed*5)*4,23,23);for(const v of particles){ctx.globalAlpha=Math.max(0,v.life/v.max);ctx.fillStyle=v.color;ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function tick(now){if(state!=='playing')return;const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;time-=dt;skillWait=Math.max(0,skillWait-dt);shield=Math.max(0,shield-dt);dash=Math.max(0,dash-dt);invincible=Math.max(0,invincible-dt);noticeLeft=Math.max(0,noticeLeft-dt);if(noticeLeft===0)notice='';if(time<=0){finish(false);draw();return}const smooth=Math.min(1,dt*24);p.renderX+=(p.x-p.renderX)*smooth;p.renderY+=(p.y-p.renderY)*smooth;for(const e of enemies){e.renderX+=(e.x-e.renderX)*smooth;e.renderY+=(e.y-e.renderY)*smooth}for(const v of particles){v.x+=v.vx*dt;v.y+=v.vy*dt;v.life-=dt}particles=particles.filter(v=>v.life>0);enemyClock+=dt;moveClock+=dt;if(moveClock>=(dash>0?.078:.14)){moveClock=0;movePlayer()}if(enemyClock>=[.39,.30,.24][difficulty]){enemyClock=0;moveEnemies()}draw();hud();if(state==='playing')frameHandle=requestAnimationFrame(tick)}
let moveClock=0;
const controls={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};document.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(controls[e.key]||controls[key]){direction(...(controls[e.key]||controls[key]));e.preventDefault()}if(e.code==='Space'){useSkill();e.preventDefault()}if(key==='p')togglePause()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{const map={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};direction(...map[b.dataset.dir]);e.preventDefault()}));let startTouch=null;canvas.addEventListener('pointerdown',e=>{startTouch={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{if(!startTouch)return;const dx=e.clientX-startTouch.x,dy=e.clientY-startTouch.y;if(Math.hypot(dx,dy)>15)direction(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));startTouch=null});ui();draw();
</script></body></html>
