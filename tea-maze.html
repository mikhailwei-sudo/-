const controls={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};document.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(controls[e.key]||controls[key]){direction(...(controls[e.key]||controls[key]));e.preventDefault()}if(e.code==='Space'){useSkill();e.preventDefault()}if(key==='p')togglePause()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{const map={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};direction(...map[b.dataset.dir]);e.preventDefault()}));let startTouch=null;canvas.addEventListener('pointerdown',e=>{startTouch={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{if(!startTouch)return;const dx=e.clientX-startTouch.x,dy=e.clientY-startTouch.y;if(Math.hypot(dx,dy)>15)direction(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));startTouch=null});ui();draw();window.addEventListener('load',drawSelectPreviews);
