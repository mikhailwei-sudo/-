name: Regression test - tea caravan handoff
on:
  push:
    paths:
      - '.github/workflows/cmit-caravan-regression.yml'
      - 'tea-adventure.html'
      - 'tea-caravan.html'
      - 'tea-packing.html'
      - 'scripts/cmit2026-caravan-handoff-probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chromium + Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run actual games, skip second cutscene, switch three languages
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/tea-server.log 2>&1 &
          python scripts/cmit2026-caravan-handoff-probe.py
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caravan-regression-evidence
          path: CMIT2026_submission/caravan-qa/
          retention-days: 30
      - name: Commit verified QA evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMIT2026_submission/caravan-qa/
          if ! git diff --cached --quiet; then
            git commit -m "Save passing caravan handoff and language test evidence"
            git push
          fi

