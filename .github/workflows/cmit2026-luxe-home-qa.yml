name: CMIT2026 first-concept home QA
on:
  push:
    paths:
      - '.github/workflows/cmit2026-luxe-home-qa.yml'
      - 'index.html'
      - 'tea-home-luxe.css'
      - 'tea-home-luxe.js'
      - 'assets/home-luxe-first-design.avif'
      - 'scripts/cmit2026-luxe-home-qa.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Open live site code in real browser at 5 sizes
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/tea-luxe-http.log 2>&1 &
          python scripts/cmit2026-luxe-home-qa.py
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMIT2026-home-first-concept-visual-QA
          path: CMIT2026_submission/home-luxe-qa
          retention-days: 30
      - name: Commit screenshot evidence
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMIT2026_submission/home-luxe-qa
          if ! git diff --cached --quiet; then
            git commit -m 'Save first-concept homepage desktop and mobile screenshots'
            git push
          fi
