name: Generate free museum narration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-museum-audio.yml'
      - 'v4/tools/download_selected_voices.py'
      - 'v4/tools/generate_audio.py'
      - 'v4/audio-guide-scripts.json'
permissions:
  contents: write
concurrency:
  group: generate-museum-audio
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Piper and MP3 encoding
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'piper-tts[zh]==1.8.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download selected licensed Piper models
        run: |
          python v4/tools/download_selected_voices.py --output v4/voices
          cat v4/voices/selected-voices.txt
      - name: Synthesize each narrated exhibit in three languages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t voice_paths < v4/voices/selected-voices.txt
          python v4/tools/generate_audio.py --voices "${voice_paths[@]}"
      - name: Check generated tracks and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("v4")
          manifest=json.loads((root/"audio-guide-manifest.json").read_text())
          assert all(len(manifest.get(l,{}))==8 for l in ("ru","zh","en")), "Incomplete audio guide"
          for files in manifest.values():
              for path in files.values():
                  p=root/path.removeprefix("./")
                  assert p.is_file() and p.stat().st_size>2000, f"Bad audio: {p}"
          print("Verified 24 nonempty narrated audio tracks")
          PY
      - name: Commit only compressed audio and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v4/audio v4/audio-guide-manifest.json
          if git diff --cached --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git commit -m "Publish free Piper narration: Dmitri Chaowen Kristin"
          git push
