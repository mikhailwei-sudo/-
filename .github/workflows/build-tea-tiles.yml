name: Build tea garden PNG atlas
on:
  push:
    paths:
      - 'scripts/build-tea-tiles.py'
      - '.github/workflows/build-tea-tiles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/build-tea-tiles.py
      - name: Commit PNG atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-assets/tea-garden-tiles.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate detailed tea garden PNG tile atlas"
            # The main branch may advance while the artwork is rendering.
            # Replay this generated asset commit onto the latest main safely.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish the generated atlas after retries" >&2
            exit 1
          fi
