function makeMaze(){
 // Connected maze carved from a spanning tree, then braided with shortcuts.

  maze[y+dy][x+dx]=' ';maze[ny][nx]=' ';stack.push([nx,ny]);

 // Open extra passages between existing corridors, forming alternative routes.
 const bridges=[];
 for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
  if(maze[y][x]!=='#')continue;
  const horizontal=pass(x-1,y)&&pass(x+1,y);
  const vertical=pass(x,y-1)&&pass(x,y+1);
  if(horizontal||vertical)bridges.push([x,y]);
 }
 for(let i=bridges.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bridges[i],bridges[j]]=[bridges[j],bridges[i]]}
 for(const [x,y] of bridges.slice(0,Math.max(38,Math.floor(bridges.length*.55))))maze[y][x]=' ';
 // More than 50 reachable tiles are always available.
