<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Великий чайный путь — два уровня</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1c1a;color:#f4e1b6;font:16px system-ui,sans-serif}header{padding:12px 16px;background:linear-gradient(90deg,#162b27,#273c31);border-bottom:2px solid #947344;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(18px,3vw,28px);margin:0}nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.step{padding:9px 12px;border:1px solid #836943;border-radius:9px;background:#20382f;color:#e4d5af}.step.active{background:#b68b4c;color:#172b23;font-weight:800}.step.done{border-color:#90bc74}.step.locked{opacity:.5}button{cursor:pointer;padding:9px 14px;background:#365b45;color:#fff1cc;border:1px solid #bb9b5c;border-radius:9px;font:inherit}main{max-width:1250px;margin:auto;padding:10px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 5px;flex-wrap:wrap}#status{font-size:14px}iframe{display:block;width:100%;height:calc(100dvh - 162px);min-height:570px;border:2px solid #a67b45;border-radius:10px;background:#11221d}#ending{position:fixed;inset:0;background:#071916ed;display:none;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}#ending.show{display:flex}.endingCard{background:#244137;border:2px solid #bfa06a;padding:35px;border-radius:20px;max-width:520px}.endingCard h2{font-size:34px;color:#f5d188}@media(max-width:700px){iframe{height:calc(100dvh - 180px);min-height:650px}header{padding:9px}nav{width:100%;justify-content:center}.step{font-size:13px;padding:7px}}</style></head><body><header><h1>🍵 Великий чайный путь · 万里茶道</h1><nav><span id="step1" class="step active">① Чайный лабиринт</span><span id="step2" class="step locked">② Чайная мастерская 🔒</span></nav></header><main><div class="bar"><span id="status">Сначала собери чай и найди выход. После победы откроется мастерская.</span><button id="reset">↻ Начать приключение заново</button></div><iframe id="stage" title="Чайное приключение" allow="autoplay" src="tea-maze.html"></iframe></main><div id="ending"><div class="endingCard"><h2>🏆 Великое чайное путешествие завершено!</h2><p>Ты собрал чай в лабиринте и отправил его по Великому чайному пути.</p><button id="again">Играть сначала</button></div></div><script>
const frame=document.getElementById('stage');let current=1;
function showStage(n){current=n;document.getElementById('step1').className='step '+(n===1?'active':'done');document.getElementById('step2').className='step '+(n===2?'active':n===1?'locked':'done');document.getElementById('step2').textContent=n===1?'② Чайная мастерская 🔒':'② Чайная мастерская ✓';document.getElementById('status').textContent=n===1?'Уровень 1: собери чай и доберись до ворот.':'Уровень 2: упакуй и отправь все заказы!';frame.src=n===1?'tea-maze.html':'tea-packing.html?from=adventure'}
function reset(){try{sessionStorage.removeItem('teaAdventureStage');sessionStorage.removeItem('teaAdventureHero');sessionStorage.removeItem('teaAdventureLanguage')}catch(e){}document.getElementById('ending').classList.remove('show');showStage(1)}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.type!=='tea-stage-complete')return;if(e.data.stage===1&&current===1){showStage(2)}else if(e.data.stage===2&&current===2){document.getElementById('ending').classList.add('show');document.getElementById('step2').className='step done'}});
document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;
try{const n=Number(sessionStorage.getItem('teaAdventureStage')||1);if(n>=2&&n<=3)showStage(2)}catch(e){}
</script></body></html>
