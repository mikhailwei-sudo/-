<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Великий чайный путь — два уровня</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1c1a;color:#f4e1b6;font:16px system-ui,sans-serif}header{padding:12px 16px;background:linear-gradient(90deg,#162b27,#273c31);border-bottom:2px solid #947344;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(18px,3vw,28px);margin:0}nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.step{padding:9px 12px;border:1px solid #836943;border-radius:9px;background:#20382f;color:#e4d5af}.step.active{background:#b68b4c;color:#172b23;font-weight:800}.step.done{border-color:#90bc74}.step.locked{opacity:.5}button{cursor:pointer;padding:9px 14px;background:#365b45;color:#fff1cc;border:1px solid #bb9b5c;border-radius:9px;font:inherit}main{max-width:1250px;margin:auto;padding:10px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 5px;flex-wrap:wrap}#status{font-size:14px}iframe{display:block;width:100%;height:calc(100dvh - 162px);min-height:570px;border:2px solid #a67b45;border-radius:10px;background:#11221d}#transition{position:fixed;inset:0;z-index:9;background:#071916f5;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}#transition.show{display:flex}#transition h2{font-size:clamp(25px,5vw,44px);color:#f5d188}#transition p{max-width:440px;line-height:1.7}#ending{position:fixed;inset:0;background:#071916ed;display:none;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}#ending.show{display:flex}.endingCard{background:#244137;border:2px solid #bfa06a;padding:35px;border-radius:20px;max-width:520px}.endingCard h2{font-size:34px;color:#f5d188}@media(max-width:700px){iframe{height:calc(100dvh - 180px);min-height:650px}header{padding:9px}nav{width:100%;justify-content:center}.step{font-size:13px;padding:7px}}@media(max-width:700px){body{overflow-x:hidden}header{display:block;padding:7px 9px}header h1{text-align:center;font-size:19px;margin:0 0 7px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}nav .step{font-size:10px;line-height:1.2;padding:6px 3px;text-align:center;min-width:0}main{padding:4px}.bar{display:flex;gap:5px;padding:3px 5px}.bar #status{font-size:11px;flex:1}.bar button{font-size:11px;padding:7px 8px}iframe{height:calc(100dvh - 136px);min-height:0;border-width:1px;border-radius:5px}.endingCard{padding:18px;max-width:95vw}.endingCard h2{font-size:23px}#transition,#ending{padding:10px}}@media(max-width:390px){nav .step{font-size:9px}header h1{font-size:17px}.bar button{font-size:10px}iframe{height:calc(100dvh - 148px)}}@media(max-height:600px) and (max-width:900px){iframe{height:calc(100dvh - 110px);min-height:0}header h1{font-size:16px}nav .step{padding:3px}}</style><style>.cutsceneCard{width:min(850px,96vw);background:#172b28;border:2px solid #c9a66d;border-radius:16px;overflow:hidden;box-shadow:0 22px 70px #000b}.cutsceneScene{height:min(49vh,365px);min-height:235px;position:relative;overflow:hidden;background:linear-gradient(#7dbac2 0%,#d8e8bd 62%,#89a975 63%)}.cutsceneBackdrop{position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 75px,#426c3e44 76px 92px,transparent 93px 150px);clip-path:polygon(0 60%,15% 38%,28% 58%,46% 30%,61% 60%,81% 38%,100% 57%,100% 100%,0 100%)}.cutsceneGround{position:absolute;bottom:0;width:100%;height:28%;background:linear-gradient(#658b54,#527d43)}.cutsceneHero{position:absolute;bottom:10%;height:65%;max-width:38%;filter:drop-shadow(0 8px 6px #203b2855);animation:cutBreathe 2.6s ease-in-out infinite}.cutsceneHero#cutCha{left:20%}.cutsceneHero#cutNik{right:19%;animation-delay:-1s}.cutsceneSpirit{position:absolute;width:11%;max-width:80px;bottom:10%;left:46%;animation:cutBreathe 1.6s infinite}.cutsceneBaskets{position:absolute;bottom:2%;left:0;width:100%;font-size:clamp(22px,4vw,36px)}.cutsceneDialog{padding:16px 20px 8px;min-height:110px;text-align:left}#cutSpeaker{font-weight:800;color:#eac486;font-size:19px;margin-bottom:8px}#cutLine{font-size:clamp(16px,2.6vw,21px);line-height:1.5;color:#f9ebd0}.cutsceneProgress{height:4px;background:#536c5e;margin-top:15px;border-radius:5px;overflow:hidden}#cutProgress{height:100%;background:#e8bd6b;width:0}.cutsceneCard button{margin:6px 0 17px;background:#a97a40;color:#fff;padding:10px 22px;border:0;border-radius:8px;cursor:pointer}@keyframes cutBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(max-width:550px){.cutsceneScene{height:260px;min-height:0}.cutsceneHero{height:62%}.cutsceneDialog{min-height:140px}}</style></head><body><header><h1>🍵 Великий чайный путь · 万里茶道</h1><nav><span id="step1" class="step active">① Чайный лабиринт</span><span id="step2" class="step locked">② Чайная мастерская 🔒</span><span id="step3" class="step locked">③ Чайный караван 🔒</span></nav></header><main><div class="bar"><span id="status">Сначала собери чай и найди выход. После победы откроется мастерская.</span><select id="adventureLang" aria-label="Language" style="padding:8px;background:#20382f;color:#f4e1b6;border:1px solid #947344;border-radius:8px"><option value="ru">Русский</option><option value="zh">中文</option><option value="en">English</option></select><button id="reset">↻ Начать приключение заново</button></div><iframe id="stage" title="Чайное приключение" allow="autoplay" src="tea-maze.html"></iframe></main><div id="transition"><div class="cutsceneCard"><div class="cutsceneScene"><video id="cutVideo" playsinline preload="metadata" muted style="display:none;width:100%;height:100%;object-fit:cover" src="game-assets/tea-cutscene-1-to-2.mp4"></video><div class="cutsceneBackdrop"></div><div class="cutsceneGround"></div><img class="cutsceneHero" id="cutCha" src="game-assets/chaer.svg" alt="Чаар"><img class="cutsceneHero" id="cutNik" src="game-assets/nik.svg" alt="Ник"><img class="cutsceneSpirit" src="game-assets/tea-spirit.svg" alt="Чайный дух"><div class="cutsceneBaskets">🧺 🍃 🧺</div></div><div class="cutsceneDialog"><div id="cutSpeaker"></div><div id="cutLine"></div><div class="cutsceneProgress"><div id="cutProgress"></div></div></div><button id="enterWorkshop">Пропустить →</button></div></div><div id="ending"><div class="endingCard"><h2>🏆 Великое чайное путешествие завершено!</h2><p>Ты собрал чай, упаковал заказы и провёл верблюжий караван через Китай, Монголию и Россию!</p><button id="again">Играть сначала</button></div></div><script>
const AD={ru:{title:'🍵 Великий чайный путь · 万里茶道',steps:['① Чайный лабиринт','② Чайная мастерская','③ Чайный караван'],reset:'↻ Начать приключение заново',status:['Уровень 1: собери чай и доберись до ворот.','Уровень 2: упакуй и отправь все заказы!','Уровень 3: доведи караван до России!'],ending:'🏆 Великое чайное путешествие завершено!',endDesc:'Ты собрал чай, упаковал заказы и провёл верблюжий караван через Китай, Монголию и Россию!',again:'Играть сначала',skip:'Пропустить →',names:['Чаар','Ник'],lines:['Уф... Сколько чайных листьев мы сегодня собрали! Я совсем устала.','Я тоже! Но посмотри, какие полные корзины. Отличная работа!','Теперь чай нужно взвесить, завернуть и подготовить к путешествию.','Тогда отправляемся в мастерскую упаковки! Впереди нас ждёт Великий чайный путь!']},zh:{title:'🍵 万里茶道 · 茶叶大冒险',steps:['① 茶园迷宫','② 茶叶包装工坊','③ 茶叶驼队'],reset:'↻ 重新开始冒险',status:['第一关：采集茶叶，找到出口。','第二关：包装并发出所有订单！','第三关：护送驼队抵达俄罗斯！'],ending:'🏆 万里茶道冒险完成！',endDesc:'你采集茶叶、包装订单，并带领驼队穿越中国、蒙古，最终抵达俄罗斯！',again:'重新开始',skip:'跳过 →',names:['茶儿','尼克'],lines:['呼……今天采了这么多茶叶，我都累坏了！','我也是！不过你看，篮子都装满了，干得漂亮！','接下来要称重、包好茶叶，为旅程做好准备。','那就出发去包装工坊吧！万里茶道的旅程还在等着我们！']},en:{title:'🍵 The Great Tea Road Adventure',steps:['① Tea Maze','② Tea Packing Workshop','③ Tea Caravan'],reset:'↻ Restart adventure',status:['Level 1: collect tea and find the exit.','Level 2: pack and ship every order!','Level 3: guide the caravan to Russia!'],ending:'🏆 The Great Tea Road adventure is complete!',endDesc:'You collected tea, packed the orders and guided a camel caravan through China, Mongolia and Russia!',again:'Play again',skip:'Skip →',names:['Chaer','Nik'],lines:['Phew... We picked so many tea leaves today! I am exhausted.','Me too! But look how full our baskets are. Great work!','Now we need to weigh, wrap and prepare the tea for its journey.','Then let’s head to the packing workshop! The Great Tea Road awaits!']}};let adLang='ru';function applyAdventureLang(){const t=AD[adLang];document.documentElement.lang=adLang;document.querySelector('header h1').textContent=t.title;for(let i=1;i<=3;i++){const el=document.getElementById('step'+i),locked=el.classList.contains('locked');el.textContent=t.steps[i-1]+(locked?' 🔒':i<current?' ✓':'')}document.getElementById('reset').textContent=t.reset;document.getElementById('status').textContent=t.status[current-1];document.querySelector('#ending h2').textContent=t.ending;document.querySelector('#ending p').textContent=t.endDesc;document.getElementById('again').textContent=t.again;document.getElementById('enterWorkshop').textContent=t.skip;if(cutStep>=0){document.getElementById('cutSpeaker').textContent=t.names[cutStep%2===0?0:1];document.getElementById('cutLine').textContent=t.lines[cutStep]}}function setAdventureLang(l){adLang=AD[l]?l:'ru';document.getElementById('adventureLang').value=adLang;try{sessionStorage.setItem('teaAdventureLanguage',adLang)}catch(e){}applyAdventureLang();try{frame.contentWindow.postMessage({type:'tea-language-change',language:adLang},location.origin)}catch(e){}}document.getElementById('adventureLang').onchange=e=>setAdventureLang(e.target.value);const frame=document.getElementById('stage');let current=1;let cutRAF=0,cutStart=0,cutStep=-1;const cutLines=[['Чаар','Уф... Сколько чайных листьев мы сегодня собрали! Я совсем устала.'],['Ник','Я тоже! Но посмотри, какие полные корзины. Отличная работа!'],['Чаар','Теперь чай нужно взвесить, завернуть и подготовить к путешествию.'],['Ник','Тогда отправляемся в мастерскую упаковки! Впереди нас ждёт Великий чайный путь!']];function finishCut(){const v=document.getElementById("cutVideo");v.pause();v.currentTime=0;v.style.display="none";document.querySelectorAll(".cutsceneScene> :not(video)").forEach(x=>x.style.display="");cancelAnimationFrame(cutRAF);document.getElementById('transition').classList.remove('show');showStage(2)}function startCut(){const v=document.getElementById("cutVideo");v.style.display="none";v.onloadeddata=()=>{if(!document.getElementById("transition").classList.contains("show"))return;v.style.display="block";document.querySelectorAll(".cutsceneScene> :not(video)").forEach(x=>x.style.display="none");v.currentTime=0;v.play().catch(()=>{});};v.onerror=()=>{v.style.display="none";document.querySelectorAll(".cutsceneScene> :not(video)").forEach(x=>x.style.display="")};v.load();cutStep=-1;cutStart=performance.now();document.getElementById('transition').classList.add('show');cancelAnimationFrame(cutRAF);cutRAF=requestAnimationFrame(playCut)}function playCut(now){const step=Math.min(cutLines.length-1,Math.floor((now-cutStart)/7500));if(step!==cutStep){cutStep=step;document.getElementById('cutSpeaker').textContent=AD[adLang].names[step%2===0?0:1];document.getElementById('cutLine').textContent=AD[adLang].lines[step]}document.getElementById('cutProgress').style.width=(((now-cutStart)%7500)/7500*100)+'%';if(now-cutStart>=cutLines.length*7500){finishCut();return}cutRAF=requestAnimationFrame(playCut)}
function showStage(n){current=n;document.getElementById('step1').className='step '+(n===1?'active':'done');document.getElementById('step2').className='step '+(n===2?'active':n===1?'locked':'done');document.getElementById('step2').textContent=n===1?'② Чайная мастерская 🔒':'② Чайная мастерская ✓';document.getElementById('step3').className='step '+(n===3?'active':'locked');document.getElementById('step3').textContent=n===3?'③ Чайный караван':'③ Чайный караван 🔒';document.getElementById('status').textContent=n===1?'Уровень 1: собери чай и доберись до ворот.':n===2?'Уровень 2: упакуй и отправь все заказы!':'Уровень 3: доведи караван до России!';frame.src=n===1?'tea-maze.html':n===2?'tea-packing.html?from=adventure':'tea-caravan.html?from=adventure';applyAdventureLang()}
function reset(){cancelAnimationFrame(cutRAF);document.getElementById('transition').classList.remove('show');try{sessionStorage.removeItem('teaAdventureStage');sessionStorage.removeItem('teaAdventureHero');sessionStorage.removeItem('teaAdventureLanguage')}catch(e){}document.getElementById('ending').classList.remove('show');showStage(1)}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.type!=='tea-stage-complete')return;if(e.data.stage===1&&current===1){startCut()}else if(e.data.stage===2&&current===2){showStage(3)}else if(e.data.stage===3&&current===3){document.getElementById('ending').classList.add('show');document.getElementById('step3').className='step done'}});
document.getElementById('enterWorkshop').onclick=finishCut;document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;
try{setAdventureLang(sessionStorage.getItem('teaAdventureLanguage')||'ru');const n=Number(sessionStorage.getItem('teaAdventureStage')||1);if(n===2)showStage(2);else if(n>=3)showStage(3)}catch(e){}
</script></body></html>
