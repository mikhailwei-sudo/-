<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Великий чайный путь — два уровня</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1c1a;color:#f4e1b6;font:16px system-ui,sans-serif}header{padding:12px 16px;background:linear-gradient(90deg,#162b27,#273c31);border-bottom:2px solid #947344;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(18px,3vw,28px);margin:0}nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.step{padding:9px 12px;border:1px solid #836943;border-radius:9px;background:#20382f;color:#e4d5af}.step.active{background:#b68b4c;color:#172b23;font-weight:800}.step.done{border-color:#90bc74}.step.locked{opacity:.5}button{cursor:pointer;padding:9px 14px;background:#365b45;color:#fff1cc;border:1px solid #bb9b5c;border-radius:9px;font:inherit}main{max-width:1250px;margin:auto;padding:10px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 5px;flex-wrap:wrap}#status{font-size:14px}iframe{display:block;width:100%;height:calc(100dvh - 162px);min-height:570px;border:2px solid #a67b45;border-radius:10px;background:#11221d}#transition{position:fixed;inset:0;z-index:9;background:#071916f5;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}#transition.show{display:flex}#transition h2{font-size:clamp(25px,5vw,44px);color:#f5d188}#transition p{max-width:440px;line-height:1.7}#ending{position:fixed;inset:0;background:#071916ed;display:none;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}#ending.show{display:flex}.endingCard{background:#244137;border:2px solid #bfa06a;padding:35px;border-radius:20px;max-width:520px}.endingCard h2{font-size:34px;color:#f5d188}@media(max-width:700px){iframe{height:calc(100dvh - 180px);min-height:650px}header{padding:9px}nav{width:100%;justify-content:center}.step{font-size:1 size:clamp(22px,4vw,36px)}.cutsceneDialog{padding:16px 20px 8px;min-height:110px;text-align:left}#cutSpeaker{font-weight:800;color:#eac486;font-size:19px;margin-bottom:8px}#cutLine{font-size:clamp(16px,2.6vw,21px);line-height:1.5;color:#f9ebd0}.cutsceneProgress{height:4px;background:#536c5e;margin-top:15px;border-radius:5px;overflow:hidden}#cutProgress{height:100%;background:#e8bd6b;width:0}.cutsceneCard button{margin:6px 0 17px;background:#a97a40;color:#fff;padding:10px 22px;border:0;border-radius:8px;cursor:pointer}@keyframes cutBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(max-width:550px){.cutsceneScene{height:260px;min-height:0}.cutsceneHero{height:62%}.cutsceneDialog{min-height:140px}}</style><style id="responsive-2026">html,body{max-width:100%;overflow-x:hidden}body{min-height:100dvh;display:flex;flex-direction:column}header{flex:0 0 auto}main{width:100%;max-width:1250px;min-width:0;flex:1;display:flex;flex-direction:column;min-height:0}.bar{flex:0 0 auto}iframe#stage{flex:1 1 auto;min-height:340px;height:calc(100dvh - 170px);max-width:100%}#transition .cutsceneCard{max-height:94dvh;overflow:auto}#cutVideo{width:100%;height:auto;max-height:55dvh;object-fit:contain}@media(max-width:700px){header{padding:6px 8px}main{padding:3px 5px}.bar{gap:4px;align-items:center}.bar #status{flex:1 1 100%;font-size:11px}.bar select,.bar button{font-size:12px;padding:6px}iframe#stage{height:calc(100dvh - 170px);min-height:350px}.cutsceneScene{height:min(42dvh,260px)}.cutsceneDialog{min-height:0;padding:10px 12px}#cutLine{font-size:15px}}@media(max-height:550px) and (orientation:landscape){header h1{font-size:14px}header{padding:3px 6px}nav .step{padding:3px;font-size:10px}.bar{padding:2px}.bar #status{display:none}iframe#stage{height:calc(100dvh - 82px);min-height:210px}.cutsceneScene{height:35dvh;min-height:110px}.cutsceneDialog{min-height:0;padding:5px}}</style><link rel="stylesheet" href="responsive-game.css"></head><body><header><h1>🍵 Великий чайный путь · 万里茶道</h1><nav><span id="step1" class="step active">① Чайный лабиринт</span><span id="step2" class="step locked">② Чайная мастерская 🔒</span><span id="step3" class="step locked">③ Чайный караван 🔒</span></nav></header><main><div class="bar"><span id="status">Сначала собери чай и найди выход. После победы откроется мастерская.</span><select id="adventureLang" aria-label="Language" style="padding:8px;background:#20382f;color:#f4e1b6;border:1px solid #947344;border-radius:8px"><option value="ru">Русский</option><option value="zh">中文</option><option value="en">English</option></select><button id="reset">↻ Начать приключение заново</button></div><iframe id="stage" title="Чайное приключение" allow="autoplay" src="tea-maze.html"></iframe></main><div id="transition"><div class="cutsceneCard"><div class="cutsceneScene"><video id="cutVideo" playsinline preload="metadata" muted style="display:none;width:100%;height:100%;object-fit:cover" ></video><div class="cutsceneBackdrop"></div><div class="cutsceneGround"></div><img class="cutsceneHero" id="cutCha" src="game-assets/chaer.svg" alt="Чаар"><img class="cutsceneHero" id="cutNik" src="game-assets/nik.svg" alt="Ник"><img class="cutsceneSpirit" src="game-assets/tea-spirit.svg" alt="Чайный дух"><div class="cutsceneBaskets">🧺 🍃 🧺</div></div><div class="cutsceneDialog"><div id="cutSpeaker"></div><div id="cutLine"></div><div class="cutsceneProgress"><div id="cutProgress"></div></div></div><button id="enterWorkshop">Пропустить →</button></div></div><div id="ending"><div class="endingCard"><h2>🏆 Великое чайное путешествие завершено!</h2><p>Ты собрал чай, упаковал заказы и провёл верблюжий караван через Китай, Монголию и Россию!</p><button id="again">Играть сначала</button></div></div><script>
const AD={ru:{title:'🍵 Великий чайный путь · 万里茶道',steps:['① Чайный лабиринт','② Чайная мастерская','③ Чайный караван'],reset:'↻ Начать приключение заново',status:['Уровень 1: собери чай и доберись до ворот.','Уровень 2: упакуй и отправь все заказы!','Уровень 3: доведи караван до России!'],ending:'🏆 Великое чайное путешествие завершено!',endDesc:'Ты собрал чай, упаковал заказы и провёл верблюжий караван через Китай, Монголию и Россию!',again:'Играть сначала',skip:'Пропустить →',names:['Чаар','Ник'],lines:['Уф... Сколько чайных листьев мы сегодня собрали! Я совсем устала.','Я тоже! Но посмотри, какие полные корзины. Отличная работа!','Теперь чай нужно взвесить, завернуть и подготовить к путешествию.','Тогда отправляемся в мастерскую упаковки! Впереди нас ждёт Великий чайный путь!']},zh:{title:'🍵 万里茶道 · 茶叶大冒险',steps:['① 茶园迷宫','② 茶叶包装工坊','③ 茶叶驼队'],reset:'↻ 重新开始冒险',status:['第一关：采集茶叶，找到出口。','第二关：包装并发出所有订单！','第三关：护送驼队抵达俄罗斯！'],ending:'🏆 万里茶道冒险完成！',endDesc:'你采集茶叶、包装订单，并带领驼队穿越中国、蒙古，最终抵达俄罗斯！',again:'重新开始',skip:'跳过 →',names:['茶儿','尼克'],lines:['呼……今天采了这么多茶叶，我都累坏了！','我也是！不过你看，篮子都装满了，干得漂亮！','接下来要称重、包好茶叶，为旅程做好准备。','那就出发去包装工坊吧！万里茶道的旅程还在等着我们！']},en:{title:'🍵 The Great Tea Road Adventure',steps:['① Tea Maze','② Tea Packing Workshop','③ Tea Caravan'],reset:'↻ Restart adventure',status:['Level 1: collect tea and find the exit.','Level 2: pack and ship every order!','Level 3: guide the caravan to Russia!'],ending:'🏆 The Great Tea Road adventure is complete!',endDesc:'You collected tea, packed the orders and guided a camel caravan through China, Mongolia and Russia!',again:'Play again',skip:'Skip →',names:['Chaer','Nik'],lines:['Phew... We picked so many tea leaves today! I am exhausted.','Me too! But look how full our baskets are. Great work!','Now we need to weigh, wrap and prepare the tea for its journey.','Then let’s head to the packing workshop! The Great Tea Road awaits!']}};let adLang='ru';function applyAdventureLang(){const t=AD[adLang];document.documentElement.lang=adLang;document.querySelector('header h1').textContent=t.title;for(let i=1;i<=3;i++){const el=document.getElementById('step'+i),locked=el.classList.contains('locked');el.textContent=t.steps[i-1]+(locked?' 🔒':i<current?' ✓':'')}document.getElementById('reset').textContent=t.reset;document.getElementById('status').textContent=t.status[current-1];document.querySelector('#ending h2').textContent=t.ending;document.querySelector('#ending p').textContent=t.endDesc;document.getElementById('again').textContent=t.again;document.getElementById('enterWorkshop').textContent=t.skip;if(cutStage&&cutStep>=0){const line=cutText[adLang][(cutStage-1)*2+cutStep];document.getElementById('cutSpeaker').textContent=line[0];document.getElementById('cutLine').textContent=line[1]}}function setAdventureLang(l){adLang=AD[l]?l:'ru';document.getElementById('adventureLang').value=adLang;try{sessionStorage.setItem('teaAdventureLanguage',adLang)}catch(e){}applyAdventureLang();try{frame.contentWindow.postMessage({type:'tea-language-change',language:adLang},location.origin)}catch(e){}}document.getElementById('adventureLang').onchange=e=>setAdventureLang(e.target.value);const frame=document.getElementById('stage');let current=1,cutRAF=0,cutStart=0,cutStep=-1,cutStage=0,cutDuration=10000,cutReady=false;const cutVideos={1:'game-assets/tea-cutscene-1.mp4',2:'game-assets/tea-cutscene-2.mp4',3:'game-assets/tea-cutscene-3.mp4'};const cutText={ru:[['Чаар','Мы собрали чай! Теперь пора в мастерскую.'],['Ник','Отлично! Подготовим чай к путешествию.'],['Чаар','Чай упакован. Пора отправлять караван!'],['Ник','Наш путь лежит через Монголию в Россию.'],['Чаар','Караван прибыл! Великий чайный путь пройден.'],['Ник','Мы доставили чай и завершили путешествие!']],zh:[['茶儿','茶叶采好了！现在去包装工坊吧。'],['尼克','太好了！我们准备好茶叶，开始旅程。'],['茶儿','茶叶包装好了！驼队可以出发了！'],['尼克','我们将穿过蒙古，前往俄罗斯。'],['茶儿','驼队抵达了！万里茶道之旅完成了。'],['尼克','我们成功送达茶叶，完成了旅程！']],en:[['Chaer','We collected the tea! Let’s head to the workshop.'],['Nik','Great! Let’s prepare the tea for its journey.'],['Chaer','The tea is packed! The caravan can depart!'],['Nik','Our route takes us through Mongolia to Russia.'],['Chaer','The caravan has arrived! We completed the Great Tea Road.'],['Nik','We delivered the tea and finished our journey!']]};function cutFallback(visible){document.querySelectorAll('.cutsceneScene > :not(video)').forEach(x=>x.style.display='none')}
function finishCut(){cancelAnimationFrame(cutRAF);cutRAF=0;const v=document.getElementById('cutVideo');v.pause();v.removeAttribute('src');v.load();document.getElementById('transition').classList.remove('show');const completed=cutStage;cutStage=0;cutStep=-1;if(completed===3){document.getElementById('ending').classList.add('show');document.getElementById('step3').className='step done';applyAdventureLang()}else if(completed>=1)showStage(completed+1)}
function startCut(stage){if(cutStage)return;cutStage=stage;cutStep=-1;cutReady=false;const v=document.getElementById('cutVideo');cancelAnimationFrame(cutRAF);cutRAF=0;cutFallback(false);v.pause();v.controls=true;v.muted=true;v.style.display='block';v.style.position='absolute';v.style.inset='0';v.style.zIndex='10';v.style.width='100%';v.style.height='100%';v.style.objectFit='contain';v.style.background='#000';document.getElementById('cutSpeaker').textContent=adLang==='ru'?'Видео после уровня '+stage:adLang==='zh'?'第'+stage+'关过场视频':'Level '+stage+' video';document.getElementById('cutLine').textContent=adLang==='ru'?'Воспроизведение видео…':adLang==='zh'?'正在播放视频…':'Playing video…';document.getElementById('cutProgress').style.width='0%';document.getElementById('transition').classList.add('show');v.onended=()=>{if(cutStage===stage)finishCut()};v.onerror=()=>{if(cutStage!==stage)return;document.getElementById('cutSpeaker').textContent=adLang==='ru'?'Ошибка загрузки видео':adLang==='zh'?'视频加载失败':'Video loading failed';document.getElementById('cutLine').textContent=v.currentSrc+' · '+(v.error?.code||'network');};v.onloadedmetadata=()=>{if(cutStage!==stage)return;cutReady=true;cutDuration=v.duration*1000||10000;v.play().catch(()=>{v.controls=true;document.getElementById('cutLine').textContent=adLang==='ru'?'Нажмите ▶ на видео для запуска':adLang==='zh'?'点击视频上的 ▶ 开始播放':'Press ▶ on the video to play'})};v.ontimeupdate=()=>{if(cutStage===stage&&v.duration>0)document.getElementById('cutProgress').style.width=Math.min(100,100*v.currentTime/v.duration)+'%'};v.src=new URL(cutVideos[stage],location.href).href;v.load();v.play().catch(()=>{v.controls=true})}
function showStage(n){current=n;document.getElementById('step1').className='step '+(n===1?'active':'done');document.getElementById('step2').className='step '+(n===2?'active':n===1?'locked':'done');document.getElementById('step2').textContent=n===1?'② Чайная мастерская 🔒':'② Чайная мастерская ✓';document.getElementById('step3').className='step '+(n===3?'active':'locked');document.getElementById('step3').textContent=n===3?'③ Чайный караван':'③ Чайный караван 🔒';document.getElementById('status').textContent=n===1?'Уровень 1: собери чай и доберись до ворот.':n===2?'Уровень 2: упакуй и отправь все заказы!':'Уровень 3: доведи караван до России!';frame.src=n===1?'tea-maze.html':n===2?'tea-packing.html?from=adventure':'tea-caravan.html?from=adventure';applyAdventureLang()}
function reset(){cutStage=0;const video=document.getElementById('cutVideo');video.pause();video.removeAttribute('src');video.load();video.style.display='none';cutFallback(true);cancelAnimationFrame(cutRAF);document.getElementById('transition').classList.remove('show');try{sessionStorage.removeItem('teaAdventureStage');sessionStorage.removeItem('teaAdventureHero');sessionStorage.removeItem('teaAdventureLanguage')}catch(e){}document.getElementById('ending').classList.remove('show');showStage(1)}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.type!=='tea-stage-complete')return;const stage=Number(e.data.stage);if(stage===current&&!cutStage){startCut(stage)}});
document.getElementById('enterWorkshop').onclick=finishCut;document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;
try{setAdventureLang(sessionStorage.getItem('teaAdventureLanguage')||'ru');const n=Number(sessionStorage.getItem('teaAdventureStage')||1);if(n===2)showStage(2);else if(n>=3)showStage(3)}catch(e){}
</script></body></html>
