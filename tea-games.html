<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>茶叶物语 · Чайные истории</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff5dd;background:#10251e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#345942,#10251e 75%);min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}header{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;gap:12px}a{color:#f8dba2}h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,55px);margin:8px 0}.wrap{max-width:1050px;margin:auto;padding:15px 20px 70px}.lead{color:#d1ddce}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.tabs button,.primary,.choice{border:2px solid #b9a06e;background:#274638;color:#fff1d5;border-radius:16px;padding:14px 8px}.tabs button.active,.primary{background:#e6bb72;color:#263b2b;font-weight:800}.scene{position:relative;min-height:450px;overflow:hidden;border:7px solid #b58b52;border-radius:26px;background:linear-gradient(#85c9d0 0 45%,#9dbe77 45% 70%,#6b9254 70%);box-shadow:0 22px 50px #0005}.sun{position:absolute;right:8%;top:8%;font-size:60px;filter:drop-shadow(0 0 18px #fff6a1)}.hill{position:absolute;bottom:16%;width:120%;left:-10%;height:30%;border-radius:50% 50% 0 0;background:#477e56}.house{position:absolute;left:5%;top:24%;font-size:80px}.character{position:absolute;left:6%;bottom:8%;font-size:72px;animation:bob 2s infinite ease-in-out}.panel{position:relative;z-index:2;background:#173b30dd;border:2px solid #e0c38c;border-radius:22px;margin:160px auto 18px;padding:20px;max-width:730px;text-align:center;backdrop-filter:blur(4px)}.panel h2{margin:0 0 10px;font-size:25px}.panel p{margin:8px 0 15px}.items{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.item{font-size:45px;background:#fff5d8;border:3px solid #bd9658;border-radius:20px;padding:12px;min-width:85px;min-height:80px;transition:transform .15s}.item:active{transform:scale(.88)}.item:disabled{opacity:.45}.meter{height:16px;background:#122a23;border-radius:20px;overflow:hidden;margin:12px auto;max-width:360px}.fill{height:100%;background:#e6b75b;transition:width .3s}.hud{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:14px 0}.pill{background:#224637;border:1px solid #a88e5c;border-radius:99px;padding:9px 16px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{min-height:65px}.message{min-height:28px;color:#ffe09b;font-weight:700}.primary{margin-top:10px;padding:12px 24px}.hidden{display:none}.route{display:flex;justify-content:space-around;align-items:center;gap:4px;margin:22px 0;font-size:35px}.route span{opacity:.4}.route span.reached{opacity:1;filter:drop-shadow(0 0 8px #ffe78c)}.cloud{position:absolute;top:13%;left:40%;font-size:48px;animation:float 5s infinite alternate}.foot{text-align:center;color:#b6c6b8;font-size:13px;margin-top:18px}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes float{to{transform:translateX(60px)}}@media(max-width:580px){.scene{min-height:510px}.panel{margin:145px 10px 12px;padding:15px}.tabs button{font-size:13px;padding:12px 4px}.character{font-size:55px}.house{font-size:60px}.item{font-size:34px;min-width:65px}.route{font-size:24px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><a href="index.html">← GREAT TEA ROAD</a><div><button onclick="lang='ru';render()">RU</button> <button onclick="lang='zh';render()">中</button> <button onclick="lang='en';render()">EN</button></div></header><main class="wrap"><h1 id="title"></h1><p class="lead" id="intro"></p><div class="tabs" id="tabs"></div><div class="hud"><span class="pill" id="level"></span><span class="pill" id="score"></span><button class="pill" id="reset"></button></div><div class="scene"><div class="sun">☀️</div><div class="cloud">☁️</div><div class="hill"></div><div class="house">🏡</div><div class="character" id="character">👩🏻‍🌾</div><section class="panel" id="game" aria-live="polite"></section></div><p class="foot" id="footer"></p></main><script>
const T={ru:{title:'Чайные истории',intro:'Три мини-игры Великого чайного пути. Собирай, обрабатывай и доставляй чай!',tabs:['🌱 Чайная ферма','🫖 Мастерская','🐫 Караван'],reset:'↻ Заново',score:'Очки',level:'Этап',farm:'Собери чайные листья',farmHint:'Нажимай на кусты, чтобы собрать 8 порций свежих листьев.',dry:'Высуши чай',dryHint:'Нажимай на бамбуковые подносы и следи за качеством сушки.',ready:'Отлично! Урожай готов.',work:'Сортировка чайных листьев',workHint:'Определи вид чая и выбери правильную корзину.',next:'Далее',done:'Поздравляем! Этап завершён!',caravan:'Караван Великого чайного пути',caravanHint:'Подготовь груз и отправляй чай из Китая в Россию.',pack:'Упаковать чай 📦',go:'Отправить караван 🐫',travel:'Караван в пути!',end:'Чай доставлен! Ты открыл исторический торговый путь.',retry:'Играть снова',correct:'Верно! +100',wrong:'Не совсем! Попробуй ещё.',footer:'Образовательная игровая демонстрация · Великий чайный путь',q:['Лунцзин','Цимэнь','Тегуаньинь','Аньхуа'],a:['Зелёный','Красный','Улун','Тёмный'],cities:['Китай','Монголия','Россия']},zh:{title:'茶叶物语',intro:'万里茶道的三款小游戏：采茶、制茶、运茶！',tabs:['🌱 茶园','🫖 制茶工坊','🐫 茶叶商队'],reset:'↻ 重来',score:'积分',level:'关卡',farm:'采摘新鲜茶叶',farmHint:'点击茶树，采集8份鲜叶。',dry:'晾晒茶叶',dryHint:'点击竹匾，完成晾晒。',ready:'太棒了！茶叶准备好了。',work:'茶叶分类',workHint:'选择正确的茶叶种类。',next:'下一步',done:'恭喜！挑战完成！',caravan:'万里茶道商队',caravanHint:'打包茶叶，沿万里茶道从中国运往俄罗斯。',pack:'打包茶叶 📦',go:'商队出发 🐫',travel:'商队正在前进！',end:'茶叶成功送达！',retry:'再玩一次',correct:'答对了！+100',wrong:'再试一次！',footer:'万里茶道 · 互动教育游戏',q:['龙井','祁门红茶','铁观音','安化黑茶'],a:['绿茶','红茶','乌龙茶','黑茶'],cities:['中国','蒙古','俄罗斯']},en:{title:'Tea Tales',intro:'Three mini-games along the Great Tea Road: harvest, craft and trade!',tabs:['🌱 Tea Farm','🫖 Workshop','🐫 Caravan'],reset:'↻ Restart',score:'Score',level:'Stage',farm:'Harvest tea leaves',farmHint:'Tap the tea bushes to gather 8 batches of leaves.',dry:'Dry the leaves',dryHint:'Tap bamboo trays to finish drying the tea.',ready:'Great! Your tea is ready.',work:'Sort the tea',workHint:'Choose the correct tea category.',next:'Next',done:'Congratulations! Level complete!',caravan:'Great Tea Road Caravan',caravanHint:'Pack tea and carry it from China to Russia.',pack:'Pack tea 📦',go:'Send caravan 🐫',travel:'The caravan is moving!',end:'Tea delivered! You have completed the trade route.',retry:'Play again',correct:'Correct! +100',wrong:'Not quite. Try again.',footer:'Great Tea Road · Educational mini-game demo',q:['Longjing','Keemun','Tieguanyin','Anhua dark tea'],a:['Green','Black / red','Oolong','Dark'],cities:['China','Mongolia','Russia']}};
let lang='ru',mode=0,progress=[0,0,0],points=[0,0,0],phase=[0,0,0],feedback='',busy=false;
const $=id=>document.getElementById(id),btn=(label,fn,cls='primary')=>'<button class="'+cls+'" data-action="'+fn+'">'+label+'</button>';
function render(){const t=T[lang];document.documentElement.lang=lang;$('title').textContent=t.title;$('intro').textContent=t.intro;$('tabs').innerHTML=t.tabs.map((s,i)=>'<button class="'+(mode===i?'active':'')+'" data-mode="'+i+'">'+s+'</button>').join('');$('score').textContent=t.score+': '+points[mode];$('level').textContent=t.level+': '+(phase[mode]+1);$('reset').textContent=t.reset;$('footer').textContent=t.footer;$('character').textContent=['👩🏻‍🌾','👨🏻‍🍳','🧑🏻‍✈️'][mode];const g=$('game');if(mode===0){if(phase[0]===0)g.innerHTML='<h2>'+t.farm+'</h2><p>'+t.farmHint+'</p><div class="items">'+Array.from({length:4},()=>btn('🌳','harvest','item')).join('')+'</div><div class="meter"><div class="fill" style="width:'+progress[0]/8*100+'%"></div></div><b>'+progress[0]+'/8 🍃</b>';else if(phase[0]===1)g.innerHTML='<h2>'+t.dry+'</h2><p>'+t.dryHint+'</p><div class="items">'+Array.from({length:3},()=>btn('🧺','dry','item')).join('')+'</div><div class="meter"><div class="fill" style="width:'+progress[0]/6*100+'%"></div></div><b>'+progress[0]+'/6 ☀️</b>';else g.innerHTML='<h2>🏆 '+t.ready+'</h2><p>⭐ '+points[0]+'</p>'+btn(t.retry,'restart');}
if(mode===1){const n=progress[1];if(n>=4)g.innerHTML='<h2>🏆 '+t.done+'</h2><p>⭐ '+points[1]+'</p>'+btn(t.retry,'restart');else g.innerHTML='<h2>'+t.work+'</h2><p>'+t.workHint+'</p><div style="font-size:48px">🍵</div><h2>'+t.q[n]+'</h2><div class="choices">'+t.a.map((s,i)=>btn(s,'sort'+i,'choice')).join('')+'</div><p class="message">'+feedback+'</p>';}
if(mode===2){const p=progress[2];g.innerHTML='<h2>'+t.caravan+'</h2><p>'+t.caravanHint+'</p><div class="route">'+['🏯','🐫','🏰'].map((s,i)=>'<span class="'+(p>=i+1?'reached':'')+'">'+s+'<small style="display:block;font-size:12px">'+t.cities[i]+'</small></span>').join('')+'</div><p class="message">'+(p===3?t.end:p===2?t.travel:'')+'</p>'+(p===0?btn(t.pack,'pack'):p<3?btn(t.go,'travel'):btn(t.retry,'restart'));}
}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){mode=+m.dataset.mode;feedback='';render();return}const a=e.target.closest('[data-action]');if(!a||busy)return;const x=a.dataset.action,t=T[lang];if(x==='restart'){progress[mode]=0;phase[mode]=0;points[mode]=0;feedback='';}else if(x==='harvest'){progress[0]++;points[0]+=10;if(progress[0]>=8){progress[0]=0;phase[0]=1}}else if(x==='dry'){progress[0]++;points[0]+=20;if(progress[0]>=6)phase[0]=2}else if(x.startsWith('sort')){const correct=+x.slice(4)===progress[1];feedback=correct?t.correct:t.wrong;if(correct){points[1]+=100;progress[1]++;} }else if(x==='pack'){progress[2]=1;points[2]+=100}else if(x==='travel'){progress[2]++;points[2]+=150;}render()});render();
</script></body></html>
