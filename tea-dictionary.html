const T={ru:{title:'🍵 Чайный словарик',intro:'Учим слова вместе с Ником и Чаэр! От чайных листьев до караванов — три языка в одном приключении.',back:'← На сайт',search:'Найти слово на любом языке…',all:'Все слова',basic:'Чай и общение',route:'Чайный путь',trade:'Торговля',museum:'Музей',game:'Наши игры',count:'слов',empty:'Ничего не найдено. Попробуй другое слово!',foot:'🍃 Великий чайный путь · Учимся вместе',speak:'Произнести'},zh:{title:'🍵 茶路小词典',intro:'和尼克、茶儿一起学词语！从茶叶到驼队，用三种语言探索万里茶道。',back:'← 返回网站',search:'搜索中文、俄语或英语词语…',all:'全部词语',basic:'茶与日常',route:'万里茶道',trade:'贸易',museum:'博物馆',game:'小游戏',count:'个词语',empty:'没有找到词语，换一个试试！',foot:'🍃 万里茶道 · 一起学语言',speak:'朗读'},en:{title:'🍵 Tea Road Dictionary',intro:'Learn with Nik and Cha’er! From tea leaves to camel caravans, explore three languages together.',back:'← Back to site',search:'Search in Russian, Chinese or English…',all:'All words',basic:'Tea & phrases',route:'Tea Road',trade:'Trade',museum:'Museum',game:'Our games',count:'words',empty:'No matching words. Try another search!',foot:'🍃 Great Tea Road · Learn together',speak:'Pronounce'}};
const $=id=>document.getElementById(id);let lang='ru',cat='all',query='';try{const saved=localStorage.getItem('gtr-lang')||sessionStorage.getItem('teaAdventureLanguage')||document.documentElement.lang;if(saved&&/^(ru|zh|en)/.test(saved))lang=saved.slice(0,2)}catch(e){}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setLang(l){lang=l;document.documentElement.lang=l;try{localStorage.setItem('gtr-lang',l);sessionStorage.setItem('teaAdventureLanguage',l)}catch(e){}render()}
function speak(w){if(!('speechSynthesis'in window)){alert('Speech synthesis is not available in this browser');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w[lang]);u.lang={ru:'ru-RU',zh:'zh-CN',en:'en-US'}[lang];u.rate=.85;speechSynthesis.speak(u)}
function render(){const t=T[lang];$('title').textContent=t.title;$('intro').textContent=t.intro;$('back').textContent=t.back;$('search').placeholder=t.search;$('foot').textContent=t.foot;document.title=t.title+' · 万里茶道';document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)});
$('tabs').innerHTML=['all','basic','route','trade','museum','game'].map(c=>'<button type="button" data-cat="'+c+'" class="'+(cat===c?'active':'')+'">'+escapeHTML(t[c])+'</button>').join('');
const filtered=WORDS.filter(w=>(cat==='all'||w.cat===cat)&&[w.ru,w.zh,w.en,w.py].some(v=>v.toLocaleLowerCase().includes(query.toLocaleLowerCase())));$('count').textContent=filtered.length+' '+t.count;
const others=['ru','zh','en'].filter(l=>l!==lang);
$('cards').innerHTML=filtered.length?filtered.map((w,i)=>'<article class="word"><div class="word-top"><span class="emoji">'+w.emoji+'</span><button type="button" class="speak" data-speak="'+WORDS.indexOf(w)+'" aria-label="'+escapeHTML(t.speak)+'">🔊 '+escapeHTML(t.speak)+'</button></div><div class="source">'+escapeHTML(w[lang])+'</div><div class="py">'+(lang==='zh'?escapeHTML(w.py):'&nbsp;')+'</div><div class="translation">'+others.map(l=>'<div><span class="language-label">'+({ru:'RU',zh:'中',en:'EN'}[l])+'</span><strong>'+escapeHTML(w[l])+'</strong>'+(l==='zh'?' <small style="color:#c7a877">'+escapeHTML(w.py)+'</small>':'')+'</div>').join('')+'</div></article>').join(''):'<div class="empty">'+escapeHTML(t.empty)+'</div>'}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));$('search').addEventListener('input',e=>{query=e.target.value.trim();render()});$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;render()}});$('cards').addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(b)speak(WORDS[+b.dataset.speak])});render();
