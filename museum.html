ru:{kicker:"Виртуальная выставка · зал 01",title:"История в пространстве",intro:"Осмотрите первый интерактивный зал Чайного пути. Поворачивайте камеру, приближайте экспонаты и выбирайте тематические станции.",label:"ЗАЛ 01 · ТОРГОВЫЕ ПУТИ",status:"Загрузка 3D-зала…",hint:"Мышь / палец — обзор · Колесо — масштаб",reset:"Сброс",source:"Перейти к источнику ↗",disclaimer:"Важно: геометрические объекты в зале — современные схематические 3D-реконструкции, а не цифровые сканы подлинных экспонатов. Исторические фотографии и музейные изображения здесь не подменяются сгенерированными иллюстрациями. Для 3D требуется интернет-соединение, чтобы загрузить Three.js.",footer:"Great Tea Road 2.0 · Демонстрационный 3D-зал",stations:[["Кяхта","Кяхта стала ключевым торговым пунктом на российско-китайской границе. В этом разделе будут собраны архивные виды, торговые документы и музейные предметы.","https://ar.culture.ru/tt/exhibition/rossii-chaynoy----staraya-stolica"],["Маймачен","Маймачен был соседним торговым поселением по другую сторону границы. Историческая экспозиция рассказывает о контактах купцов и устройстве торговой жизни.","https://commons.wikimedia.org/wiki/Category:Kyakhta"],["Кирпичный чай","Прессованные чайные кирпичи были удобны для длительной транспортировки. Представленный в сцене блок — условная модель, а не фотография или 3D-скан артефакта.","https://www.si.edu/object/tea-brick-china-19th-century%3Anmah_1068779"],["Караванный путь","Чай перевозили в несколько этапов по речным и сухопутным торговым путям. Маршруты менялись со временем: единая линия на карте не должна подразумевать точность исторической дороги до метра.","https://collection.sciencemuseumgroup.org.uk/objects/co124194/slab-of-compressed-tea-china-before-1930"]]},
zh:{kicker:"虚拟展览 · 第一展厅",title:"走进历史",intro:"探索万里茶道的第一个互动展厅。转动视角、放大展品，点击不同主题。",label:"第一展厅 · 茶叶贸易",status:"正在加载3D展厅…",hint:"鼠标或触控：旋转 · 滚轮：缩放",reset:"重置",source:"查看来源 ↗",disclaimer:"说明：展厅里的几何模型是现代简化示意，并非真实文物的三维扫描。历史照片不使用AI合成图替代。Three.js库需联网加载。",footer:"万里茶道 2.0 · 互动3D展厅",stations:[["恰克图","恰克图是中俄边境重要的贸易中心。本区将展出历史照片、贸易文件和博物馆藏品。","https://ar.culture.ru/tt/exhibition/rossii-chaynoy----staraya-stolica"],["买卖城","买卖城位于边境另一侧，是商人往来交流的重要地点。","https://commons.wikimedia.org/wiki/Category:Kyakhta"],["砖茶","压制的砖茶适合远距离运输。场景中的砖块只是示意模型，不是真实文物扫描。","https://www.si.edu/object/tea-brick-china-19th-century%3Anmah_1068779"],["商队路线","茶叶经陆路和水路分段运输，不同历史时期的路线存在差异。","https://collection.sciencemuseumgroup.org.uk/objects/co124194/slab-of-compressed-tea-china-before-1930"]]},
en:{kicker:"Virtual exhibition · Hall 01",title:"Step into history",intro:"Explore the first interactive Great Tea Road gallery. Rotate, zoom, and select thematic stations to discover the story.",label:"HALL 01 · TEA TRADE",status:"Loading the 3D gallery…",hint:"Drag to rotate · Scroll to zoom",reset:"Reset",source:"View source ↗",disclaimer:"Note: all geometric forms in this room are schematic modern reconstructions, not scans of authentic artifacts. We do not replace historical photographs with synthetic images. Loading Three.js for WebGL requires an internet connection.",footer:"Great Tea Road 2.0 · Interactive 3D exhibit",stations:[["Kyakhta","Kyakhta was a major border trading center. Historical views, trade documents and museum objects will be gathered for this section.","https://ar.culture.ru/tt/exhibition/rossii-chaynoy----staraya-stolica"],["Maimaichen","Maimaichen, across the border from Kyakhta, was a trading settlement where merchants met and exchanged goods.","https://commons.wikimedia.org/wiki/Category:Kyakhta"],["Brick tea","Pressed tea bricks were convenient for long-distance shipping. The brick here is an explanatory model, not a scan of an authentic object.","https://www.si.edu/object/tea-brick-china-19th-century%3Anmah_1068779"],["Caravan routes","Tea moved in multiple legs over waterways and overland routes; routes varied by era and should not be represented as an exact GPS trace.","https://collection.sciencemuseumgroup.org.uk/objects/co124194/slab-of-compressed-tea-china-before-1930"]]}
